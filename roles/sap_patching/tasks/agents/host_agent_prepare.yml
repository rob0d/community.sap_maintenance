# SPDX-License-Identifier: Apache-2.0
---

# Host agent is present on every host in play, so there is no installation election as for the kernel
# or HDB client. The primary host - the single writer for a shared staging area - is the first host
# in play, evaluated identically on every host thanks to the default 'linear' strategy.
- name: SAP Patching - Host Agent - Prepare - Set fact with the primary host for a shared staging area
  ansible.builtin.set_fact:
    __sap_patching_fact_host_agent_primary_host: "{{ ansible_play_hosts | first | d('') }}"


- name: Block for base directory
  block:
    # Stat only on hosts that will create the directory (the primary in shared mode, or every host with a
    # per-host staging area). Non-primary hosts skip this so they do not cache an NFS negative lookup,
    # which is kept for up to 'acdirmax' and would hide the directory the primary is about to create.
    - name: SAP Patching - Host Agent - Prepare - Stat availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_host_agent_base }}"
      register: __sap_patching_register_host_agent_prepare_base_stat
      when:
        - not sap_patching_host_agent_files_shared
          or inventory_hostname == __sap_patching_fact_host_agent_primary_host

    # In shared mode only the primary host creates the directory, so a missing shared mount on another
    # host is reported below instead of being masked by a local directory on the mount point.
    - name: SAP Patching - Host Agent - Prepare - Create base directory with user {{ __sap_patching_file_owner }}
      ansible.builtin.file:
        path: "{{ __sap_patching_host_agent_base }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not sap_patching_host_agent_files_shared
          or inventory_hostname == __sap_patching_fact_host_agent_primary_host
        - not __sap_patching_register_host_agent_prepare_base_stat.stat.exists

    # Verify the directory is visible on every host, retrying to absorb NFS propagation delay after the
    # primary created it. 'failed_when: false' lets the dedicated task below report a helpful message.
    - name: SAP Patching - Host Agent - Prepare - Verify availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_host_agent_base }}"
      register: __sap_patching_register_host_agent_prepare_base_stat
      until: __sap_patching_register_host_agent_prepare_base_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false

    - name: SAP Patching - Host Agent - Prepare - Fail if the base directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The base directory "{{ __sap_patching_host_agent_base }}" is not available on this host.
          {% if sap_patching_host_agent_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_host_agent_primary_host }}".
          Ensure the base directory is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_host_agent_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_host_agent_prepare_base_stat.stat.exists

    - name: SAP Patching - Host Agent - Prepare - Fail if base directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_host_agent_base }}" exists but it is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_host_agent_base' is a directory.
      when: not __sap_patching_register_host_agent_prepare_base_stat.stat.isdir

    - name: SAP Patching - Host Agent - Prepare - Stat base directory with user {{ __sap_patching_file_owner }}
      ansible.builtin.stat:
        path: "{{ __sap_patching_host_agent_base }}"
      register: __sap_patching_register_host_agent_prepare_base_user_stat
      # Stat with correct user to check permissions.
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    - name: SAP Patching - Host Agent - Prepare - Fail if user cannot write to base directory
      ansible.builtin.fail:
        msg: |
          FAIL: User '{{ __sap_patching_file_owner }}' does not have write permissions
          to the directory '{{ sap_patching_host_agent_base }}'
          defined in the variable 'sap_patching_host_agent_base'.

          Ansible cannot create the symlink '{{ sap_patching_host_agent_to_apply_symlink }}' without write access to this path.
          Please check the directory permissions (chmod/chown).
      when: not __sap_patching_register_host_agent_prepare_base_user_stat.stat.writeable


- name: Block for source directory
  block:
    # Stat only on creating hosts, so non-primary hosts do not cache an NFS negative lookup
    # (see the base directory block above for the full explanation).
    - name: SAP Patching - Host Agent - Prepare - Stat availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_host_agent_source }}"
      register: __sap_patching_register_host_agent_prepare_source_stat
      when:
        - not sap_patching_host_agent_files_shared
          or inventory_hostname == __sap_patching_fact_host_agent_primary_host

    # In shared mode only the primary host creates the directory, so a missing shared mount on another
    # host is reported below instead of being masked by a local directory on the mount point.
    - name: SAP Patching - Host Agent - Prepare - Create source directory with user {{ __sap_patching_file_owner }}
      ansible.builtin.file:
        path: "{{ __sap_patching_host_agent_source }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not sap_patching_host_agent_files_shared
          or inventory_hostname == __sap_patching_fact_host_agent_primary_host
        - not __sap_patching_register_host_agent_prepare_source_stat.stat.exists

    # Verify the directory is visible on every host, retrying to absorb NFS propagation delay after the
    # primary created it. 'failed_when: false' lets the dedicated task below report a helpful message.
    - name: SAP Patching - Host Agent - Prepare - Verify availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_host_agent_source }}"
      register: __sap_patching_register_host_agent_prepare_source_stat
      until: __sap_patching_register_host_agent_prepare_source_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false

    - name: SAP Patching - Host Agent - Prepare - Fail if the source directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The source directory "{{ __sap_patching_host_agent_source }}" is not available on this host.
          {% if sap_patching_host_agent_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_host_agent_primary_host }}".
          Ensure the source directory is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_host_agent_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_host_agent_prepare_source_stat.stat.exists

    - name: SAP Patching - Host Agent - Prepare - Fail if source directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_host_agent_source }}" exists but it is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_host_agent_source' is a directory.
      when: not __sap_patching_register_host_agent_prepare_source_stat.stat.isdir


    # Copy to multiple targets can saturate the control node and the network.
    # With a shared staging area the copy runs only on the elected primary host, because every host
    # sees the same source directory. With a per-host staging area it runs on every host, and 'throttle'
    # limits it to one copy at a time so the control node and network are not saturated.
    # Set 'sap_patching_disable_throttle' to 'true' to copy to all hosts in parallel.
    - name: Block for local source directory
      throttle: "{{ 0 if sap_patching_disable_throttle | d(false) else 1 }}"
      when:
        - not sap_patching_host_agent_files_on_target
        - not sap_patching_host_agent_files_shared
          or inventory_hostname == __sap_patching_fact_host_agent_primary_host
      block:
        - name: SAP Patching - Host Agent - Prepare - Stat availability of the local source directory
          ansible.builtin.stat:
            path: "{{ __sap_patching_host_agent_source_local }}"
          delegate_to: localhost  # Stat should be executed on control node where the files are located
          register: __sap_patching_register_host_agent_source_local_stat

        - name: SAP Patching - Host Agent - Prepare - Fail if local source directory does not exist
          ansible.builtin.fail:
            msg: |
              FAIL: The path "{{ sap_patching_host_agent_source_local }}" does not exist or is not a directory.
              Please ensure that the host agent source path is correct and accessible.
          when: not (__sap_patching_register_host_agent_source_local_stat.stat.exists
                  and __sap_patching_register_host_agent_source_local_stat.stat.isdir)

        - name: SAP Patching - Host Agent - Prepare - Copy source files from control node to managed node
          ansible.builtin.copy:
            src: "{{ __sap_patching_host_agent_source_local }}/"  # Trailing slash is required.
            dest: "{{ __sap_patching_host_agent_source }}/"
            remote_src: false  # Copy from control node
            mode: '0755'
            owner: "{{ __sap_patching_file_owner }}"
            group: "{{ sap_patching_file_group }}"


# Search for host agent SAR files and extract support package number
- name: SAP Patching - Host Agent - Prepare - Find SAR files in the source directory (case-insensitive)
  ansible.builtin.find:
    paths: "{{ __sap_patching_host_agent_source }}"
    patterns: ['(?i)SAPHOSTAGENT.*\.SAR$']
    use_regex: true
    file_type: file
    recurse: false
  register: __sap_patching_register_host_agent_source_dir_content


- name: Block to execute only if SAR files were found
  # With a shared staging area extraction is limited to the elected primary host, so it happens exactly
  # once. With a per-host staging area every host extracts its own copy.
  when:
    - not sap_patching_host_agent_files_shared
      or inventory_hostname == __sap_patching_fact_host_agent_primary_host
    - __sap_patching_register_host_agent_source_dir_content.matched | d(0) > 0
  block:

    # In case there are more than one SAR files, get the one with the highest version number
    - name: SAP Patching - Host Agent - Prepare - Set fact with the highest version of host agent SAR file
      ansible.builtin.set_fact:
        __sap_patching_fact_host_agent_sar: >-
          {{
            __sap_patching_register_host_agent_source_dir_content.files
              | map(attribute='path')
              | map('basename')
              | sort
              | list
              | last
          }}

    # Example: File 'SAPHOSTAGENT71_71-80004822.SAR' results in version '71_71'.
    - name: SAP Patching - Host Agent - Prepare - Set fact with extracted host agent version from SAR file
      ansible.builtin.set_fact:
        __sap_patching_fact_host_agent_version: >-
          {{
            __sap_patching_fact_host_agent_sar
              | regex_search('(?i)SAPHOSTAGENT([0-9]+_[0-9]+)-[0-9]{8}\.SAR', '\1')
              | d([], true)
              | first
              | d('', true)
          }}

    - name: SAP Patching - Host Agent - Prepare - Fail if no host agent version could be extracted from SAR file name
      ansible.builtin.fail:
        msg: |
          FAIL: No host agent version could be extracted from SAR file name '{{ __sap_patching_fact_host_agent_sar }}'.
          Please ensure that the SAR file name follows the expected pattern.
          Example: File 'SAPHOSTAGENT71_71-80004822.SAR' results in version '71_71'
      when: __sap_patching_fact_host_agent_version == ''

    - name: SAP Patching - Host Agent - Prepare - Show version extracted from SAR file name
      ansible.builtin.debug:
        msg: >-
          INFO: Host agent version extracted from SAR file name '{{ __sap_patching_fact_host_agent_sar }}'
          is '{{ __sap_patching_fact_host_agent_version }}'.
      when: __sap_patching_fact_host_agent_version != ''

    - name: SAP Patching - Host Agent - Prepare - Set fact with the target host agent directory
      ansible.builtin.set_fact:
        __sap_patching_fact_host_agent_extract_target:
          "{{ __sap_patching_host_agent_base }}/{{ __sap_patching_host_agent_extracted }}_{{ __sap_patching_fact_host_agent_version }}"


    - name: SAP Patching - Host Agent - Prepare - Create target host agent directory
      ansible.builtin.file:
        path: "{{ __sap_patching_fact_host_agent_extract_target }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when: __sap_patching_fact_host_agent_version != ''

    - name: SAP Patching - Host Agent - Prepare - Stat availability of the target host agent directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_host_agent_extract_target }}"
      register: __sap_patching_register_host_agent_extract_target_stat

    - name: SAP Patching - Host Agent - Prepare - Fail if target host agent directory does not exist or is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: Target host agent directory '{{ __sap_patching_fact_host_agent_extract_target }}' does not exist or is not a directory.
      when: not (__sap_patching_register_host_agent_extract_target_stat.stat.exists
              and __sap_patching_register_host_agent_extract_target_stat.stat.isdir)


    # Shell is used instead of copy/move modules to ensure we can use globbing
    # to copy file in case they are not in capitals as expected.
    # Copy is used to ensure we do not remove source files.
    - name: SAP Patching - Host Agent - Prepare - Copy all files {{ __direction }}
      ansible.builtin.shell:
        cmd: >-
          cp '{{ __sap_patching_host_agent_source }}'/[Ss][Aa][Pp][Hh][Oo][Ss][Tt][Aa][Gg][Ee][Nn][Tt]*
          '{{ __sap_patching_host_agent_base }}/'
      vars:
        __direction: "from {{ __sap_patching_host_agent_source }} to {{ __sap_patching_host_agent_base }}"
      when: __sap_patching_host_agent_base != __sap_patching_host_agent_source
      changed_when: true

    - name: SAP Patching - Host Agent - Prepare - Extract host agent SAR file
      ansible.builtin.command:
        cmd: >-
          {{ __sap_patching_sapcar_path }}/{{ sap_patching_sapcar_file_name }}
          -xvf {{ __sap_patching_host_agent_base }}/{{ __sap_patching_fact_host_agent_sar }}
          -R "{{ __sap_patching_fact_host_agent_extract_target }}"
          -manifest SIGNATURE.SMF
      register: __sap_patching_register_extract_result
      args:
        chdir: "{{ __sap_patching_fact_host_agent_extract_target }}"
      become: true
      become_user: "{{ __sap_patching_file_owner }}"
      changed_when: "'SAPCAR: processing archive' in __sap_patching_register_extract_result.stdout"

    - name: SAP Patching - Host Agent - Prepare - Fail if extraction of host agent SAR file failed
      ansible.builtin.fail:
        msg: |
          FAIL: Extraction of host agent SAR file '{{ __sap_patching_fact_host_agent_sar }}' failed.
          SAPCAR output: {{ __sap_patching_register_extract_result.stdout | d('') }}
          SAPCAR error: {{ __sap_patching_register_extract_result.stderr | d('') }}
      when: __sap_patching_register_extract_result.rc != 0


    - name: SAP Patching - Host Agent - Prepare - Stat availability of the host agent extracted path
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_host_agent_extract_target }}/saphostexec"
      register: __sap_patching_register_host_agent_extracted_stat

    - name: SAP Patching - Host Agent - Prepare - Fail if host agent extracted path does not exist or is not a regular file
      ansible.builtin.fail:
        msg: >-
          FAIL: Host agent file '{{ __sap_patching_fact_host_agent_extract_target }}/saphostexec'
          does not exist or is not a regular file.
      when: not (__sap_patching_register_host_agent_extracted_stat.stat.exists
              and __sap_patching_register_host_agent_extracted_stat.stat.isreg)

    - name: SAP Patching - Host Agent - Prepare - Ensure symbolic link for host agent directory is correct
      ansible.builtin.file:
        src: "{{ __sap_patching_fact_host_agent_extract_target }}"
        dest: "{{ __sap_patching_host_agent_base }}/{{ sap_patching_host_agent_to_apply_symlink }}"
        state: link
        force: true
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    - name: SAP Patching - Host Agent - Prepare - Set fact with prepared path for further execution tasks
      ansible.builtin.set_fact:
        __sap_patching_fact_host_agent_to_apply_prepared:
          "{{ __sap_patching_fact_host_agent_extract_target }}"


- name: SAP Patching - Host Agent - Prepare - Inform that SAR files were not found
  ansible.builtin.debug:
    msg: |
      No host agent SAR files found in source directory {{ __sap_patching_host_agent_source }}.
      Skipping host agent preparation.
  when: __sap_patching_register_host_agent_source_dir_content.matched | d(0) == 0


# In shared mode the host agent is prepared only on the primary host, so the remaining hosts copy the
# resolved path from it. The staging area is shared, therefore the path is identical and the verification
# block below can confirm that every host actually sees the prepared host agent.
- name: SAP Patching - Host Agent - Prepare - Propagate prepared host agent path from the primary host
  ansible.builtin.set_fact:
    __sap_patching_fact_host_agent_to_apply_prepared:
      "{{ hostvars[__sap_patching_fact_host_agent_primary_host]['__sap_patching_fact_host_agent_to_apply_prepared'] }}"
  when:
    - sap_patching_host_agent_files_shared
    - inventory_hostname != __sap_patching_fact_host_agent_primary_host
    - hostvars[__sap_patching_fact_host_agent_primary_host]['__sap_patching_fact_host_agent_to_apply_prepared'] is defined


# Executed on every host, because extraction above can be limited to the elected primary host.
# This is the only check proving that the base directory is really shared.
- name: Block for all hosts
  when: __sap_patching_fact_host_agent_to_apply_prepared is defined
  block:

    - name: SAP Patching - Host Agent - Prepare - Stat prepared host agent directory on all hosts
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_host_agent_to_apply_prepared }}/saphostexec"
      register: __sap_patching_register_host_agent_prepared_stat

    - name: SAP Patching - Host Agent - Prepare - Fail if prepared host agent is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The prepared host agent "{{ __sap_patching_fact_host_agent_to_apply_prepared }}" is not available on this host.
          Host agent was prepared only on the elected primary host "{{ __sap_patching_fact_host_agent_primary_host }}",
          because the variable 'sap_patching_host_agent_files_shared' is set to 'true'.

          Please ensure that the path defined in the variable 'sap_patching_host_agent_base'
          is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_host_agent_files_shared' to 'false' to prepare the host agent on every host separately.
      when: not __sap_patching_register_host_agent_prepared_stat.stat.exists
