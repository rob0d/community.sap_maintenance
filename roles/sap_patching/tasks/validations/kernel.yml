---

# Validation of directory existence is not performed here, because:
# - Prepare tasks will create directory if not present.
# - Apply task will fail if not present.
- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_base' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_base is defined
      - sap_patching_kernel_base is string
      - sap_patching_kernel_base | length > 0
      - sap_patching_kernel_base is match('^/')
    fail_msg: |
      The variable 'sap_patching_kernel_base' is undefined, empty, or invalid.
      It should be an absolute path (starting with /) where kernel SP directories are created.

# Validation of directory existence is not performed here, because:
# - Prepare tasks will create directory if not present.
#   Required when 'sap_patching_kernel_files_on_target' is 'false'.
- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_source' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_source is defined
      - sap_patching_kernel_source is string
      - sap_patching_kernel_source | length > 0
    fail_msg: |
      The variable 'sap_patching_kernel_source' is undefined, empty, or invalid.
      It should be a path where the kernel files are located.


- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_files_shared' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_files_shared is defined
      - sap_patching_kernel_files_shared is boolean
    fail_msg: |
      The variable 'sap_patching_kernel_files_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating whether the kernel files will be shared among multiple hosts.

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_files_on_target' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_files_on_target is defined
      - sap_patching_kernel_files_on_target is boolean
    fail_msg: |
      The variable 'sap_patching_kernel_files_on_target' is undefined or invalid.
      It should be a boolean (true/false) indicating whether the kernel files are already present on the managed nodes.

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_source_local' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_source_local is defined
      - sap_patching_kernel_source_local is string
      - sap_patching_kernel_source_local | length > 0
    fail_msg: |
      The variable 'sap_patching_kernel_source_local' is undefined, empty, or invalid.
      It should be a path where the kernel files are located on the control node.
      It is required because the variable 'sap_patching_kernel_files_on_target' is set to 'false'.
  when: not sap_patching_kernel_files_on_target


# We do not check if it is empty string, because detection will populate it.
- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_to_apply' is defined as a string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_to_apply is defined
      - sap_patching_kernel_to_apply is string
    fail_msg: |
      The variable 'sap_patching_kernel_to_apply' is undefined or invalid.
      It should be either empty string (to use default symlink) or a path to the kernel to be applied.

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_prepare_version' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_prepare_version is defined
      - sap_patching_kernel_prepare_version is string
      - sap_patching_kernel_prepare_version | length > 0
      - sap_patching_kernel_prepare_version == 'autodetect' or sap_patching_kernel_prepare_version is match('^\d{3,4}$')
    fail_msg: |
      The variable 'sap_patching_kernel_prepare_version' is undefined or invalid.
      It should be either 'autodetect' or a 3-digit kernel version number (e.g. '793').

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_prepare_append_to_version' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_prepare_append_to_version is defined
      - sap_patching_kernel_prepare_append_to_version is string
      - sap_patching_kernel_prepare_append_to_version | length == 0 or sap_patching_kernel_prepare_append_to_version is match('^\d{3,4}p\d+$')
    fail_msg: |
      The variable 'sap_patching_kernel_prepare_append_to_version' is undefined or invalid.
      It should be either empty string or in format '<kernel_version>p<patch_number>' (e.g. '793p320').


- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_restart_strategy' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_restart_strategy is defined
      - sap_patching_kernel_restart_strategy is string
      - sap_patching_kernel_restart_strategy in ['all', 'rks', 'bootstrap']
    fail_msg: |
      The variable 'sap_patching_kernel_restart_strategy' is undefined or invalid.
      It should be one of: 'all' (restart whole system), 'rks' (Rolling Kernel Switch), or 'bootstrap' (restart only sapstartsrv).

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_rks_wait_timeout' is defined as number greater than 0
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_rks_wait_timeout is defined
      - sap_patching_kernel_rks_wait_timeout is number
      - sap_patching_kernel_rks_wait_timeout > 0
    fail_msg: |
      The variable 'sap_patching_kernel_rks_wait_timeout' is undefined or invalid.
      It should be a positive integer (in seconds) greater than 0, typically more than rdisp/server_startup/max_time (default: 600).

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_rks_soft_timeout' is defined as integer
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_rks_soft_timeout is defined
      - sap_patching_kernel_rks_soft_timeout is integer
    fail_msg: |
      The variable 'sap_patching_kernel_rks_soft_timeout' is undefined or invalid.
      It should be an integer (in seconds) indicating the soft timeout for the Rolling Kernel Switch.

- name: SAP Patching - Validation - Kernel - Assert that the variable 'sap_patching_kernel_restart_strategy' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_kernel_restart_strategy is defined
      - sap_patching_kernel_restart_strategy is string
      - sap_patching_kernel_restart_strategy in ['bootstrap', 'all', 'rks']
    fail_msg: |
      FAIL: The variable 'sap_patching_kernel_restart_strategy' must be one of: 'bootstrap', 'all', 'rks'.


- name: SAP Patching - Validation - Kernel - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
