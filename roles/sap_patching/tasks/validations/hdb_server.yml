# SPDX-License-Identifier: Apache-2.0
---

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_system_sid' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_system_sid is string
      - sap_patching_hdb_system_sid | trim | length == 3
    fail_msg: |
      The variable 'sap_patching_hdb_system_sid' is undefined, not 3 characters long or invalid.
      It should be a valid SAP system SID string of 3 characters.
      This is used when HANA SID is different than the SAP system SID.
  when: sap_patching_hdb_system_sid is defined

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_sap_system_sid' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_sap_system_sid is defined
      - sap_patching_sap_system_sid is string
      - sap_patching_sap_system_sid | trim | length == 3
    fail_msg: |
      The variable 'sap_patching_sap_system_sid' is undefined, not 3 characters long or invalid.
      It should be a valid SAP system SID string of 3 characters.
  when: sap_patching_hdb_system_sid is not defined

- name: SAP Patching - Validation - HDB Server - Set fact with the system SID to be used for HANA
  ansible.builtin.set_fact:
    __sap_patching_fact_sap_system_sid:
      "{{ sap_patching_hdb_system_sid | upper | d(sap_patching_sap_system_sid | upper) }}"
    __sap_patching_fact_sidadm_user:
      "{{ sap_patching_hdb_system_sid | upper | d(sap_patching_sap_system_sid | upper) }}adm"


# Validation of directory existence is not performed here, because:
# - Prepare tasks will create directory if not present.
# - Apply task will fail if not present.
- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_base' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_base is defined
      - sap_patching_hdb_server_base is string
      - sap_patching_hdb_server_base | length > 0
      - sap_patching_hdb_server_base is match('^/')
    fail_msg: |
      The variable 'sap_patching_hdb_server_base' is undefined, empty, or invalid.
      It should be an absolute path (starting with /) where HDB server SAR files are stored and extraction directories are created.

# Validation of directory existence is not performed here, because:
# - Prepare tasks will create directory if not present.
#   Required when 'sap_patching_hdb_server_files_on_target' is 'false'.
- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_source' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_source is defined
      - sap_patching_hdb_server_source is string
      - sap_patching_hdb_server_source | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_server_source' is undefined, empty, or invalid.
      It should be a path where the HDB server SAR files are located (used during the prepare step).


- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_files_shared' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_files_shared is defined
      - sap_patching_hdb_server_files_shared is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_server_files_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating whether the HDB server files will be shared among multiple hosts.

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_files_on_target' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_files_on_target is defined
      - sap_patching_hdb_server_files_on_target is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_server_files_on_target' is undefined or invalid.
      It should be a boolean (true/false) indicating whether the HDB server files are already present on the managed nodes.

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_source_local' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_source_local is defined
      - sap_patching_hdb_server_source_local is string
      - sap_patching_hdb_server_source_local | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_server_source_local' is undefined, empty, or invalid.
      It should be a path where the HDB server files are located on the control node.
  when: not sap_patching_hdb_server_files_on_target


- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_install_path' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_install_path is defined
      - sap_patching_hdb_server_install_path is string
      - sap_patching_hdb_server_install_path | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_server_install_path' is undefined, empty, or invalid.
      It should be the installation path of the HDB server (used to check the existing installation).


# We do not check if it is empty string, because detection will populate it.
- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_to_apply' is defined as string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_to_apply is defined
      - sap_patching_hdb_server_to_apply is string
    fail_msg: |
      The variable 'sap_patching_hdb_server_to_apply' is undefined or invalid.
      It should be either empty string (to use default symlink) or a path to the HDB server to be applied.


- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_cf_system_user' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_cf_system_user is string
      - sap_patching_hdb_server_cf_system_user | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_server_cf_system_user' is undefined or invalid.
      It should be non-empty string with the username to perform the update.
  when: sap_patching_hdb_server_cf_system_user is defined

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_cf_system_user_password' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_cf_system_user_password is string
      - sap_patching_hdb_server_cf_system_user_password | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_server_cf_system_user_password' is undefined or invalid.
      It should be the password for the HANA user used to perform the update (SYSTEM user or custom user).
  when: sap_patching_hdb_server_cf_system_user_password is defined

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_activate_system_user' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_activate_system_user is defined
      - sap_patching_hdb_server_activate_system_user is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_server_activate_system_user' is undefined or invalid.
      It should be a boolean (true/false) indicating if the SYSTEM user should be activated prior to patching.


# hdbuserstore key takes priority, then fall back on username and password.
- name: Block for user activation
  when: sap_patching_hdb_server_activate_system_user | d(true)
  block:

    - name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_activate_admin_userstore_key' is valid
      ansible.builtin.assert:
        that:
          - sap_patching_hdb_server_activate_admin_userstore_key is string
          - sap_patching_hdb_server_activate_admin_userstore_key | trim | length > 0
        fail_msg: |
          The variable 'sap_patching_hdb_server_activate_admin_userstore_key' is defined as empty string or invalid.
          Either provide valid HANA admin user store key (hdbuserstore),
          or unset this variable and use 'sap_patching_hdb_server_activate_admin_user' and 'sap_patching_hdb_server_activate_admin_password' instead.
      when: sap_patching_hdb_server_activate_admin_userstore_key is defined

    - name: Block for fallback username and password
      when: sap_patching_hdb_server_activate_admin_userstore_key is not defined
      block:
        - name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_activate_admin_user' is valid
          ansible.builtin.assert:
            that:
              - sap_patching_hdb_server_activate_admin_user is defined
              - sap_patching_hdb_server_activate_admin_user is string
              - sap_patching_hdb_server_activate_admin_user | trim | length > 0
            fail_msg: |
              The variable 'sap_patching_hdb_server_activate_admin_user' is undefined, empty, or invalid.
              It should be a non-empty string representing the HANA admin username to use when activating the SYSTEM user.

        - name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_activate_admin_password' is valid
          ansible.builtin.assert:
            that:
              - sap_patching_hdb_server_activate_admin_password is defined
              - sap_patching_hdb_server_activate_admin_password is string
              - sap_patching_hdb_server_activate_admin_password | trim | length > 0
            fail_msg: |
              The variable 'sap_patching_hdb_server_activate_admin_password' is undefined, empty, or invalid.
              It should be a non-empty string representing the password of the HANA admin user used when activating the SYSTEM user.


- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_is_clustered' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_is_clustered is defined
      - sap_patching_hdb_server_is_clustered is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_server_is_clustered' is undefined or invalid.
      It should be a boolean (true/false) indicating if the database is clustered (Redhat/Suse with Pacemaker).

- name: SAP Patching - Validation - HDB Server - Assert that the variable 'sap_patching_hdb_server_cluster_hdb_resource_name' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_server_cluster_hdb_resource_name is defined
      - sap_patching_hdb_server_cluster_hdb_resource_name is string
      - sap_patching_hdb_server_cluster_hdb_resource_name | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_server_cluster_hdb_resource_name' is undefined, empty, or invalid.
      It should be the name of the cluster resource for HDB server (used to relocate and put the resource in maintenance mode).
  when: sap_patching_hdb_server_is_clustered | bool


- name: SAP Patching - Validation - HDB Server - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
