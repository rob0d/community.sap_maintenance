---

### General settings

# The list of tasks that will be executed by this role in the specific order (String).
# Available options:
# - Kernel: abap_kernel_prepare, abap_kernel_apply, abap_kernel_restart
# - HDB Client: hdb_client_prepare, hdb_client_apply
# - HDB Server: hdb_server_prepare, hdb_server_apply, hdb_server_update_prepare, hdb_server_update_resume
# - Host Agent: host_agent_prepare, host_agent_apply_auto, host_agent_apply_manual
# - Web Dispatcher: webdisp_prepare, webdisp_apply, webdisp_restart
# - ABAP Start Stop: abap_stop_system, abap_start_system
sap_patching_execution_plan: []

#### SAP system definitions ####
# The SAP System ID (SID) (String).
# NOTE: In case of using database with different SID, use 'sap_patching_hdb_system_sid' to define HANA SID.
sap_patching_sap_system_sid: ''

# The path to directory where SAPCAR executable is located (String).
sap_patching_sapcar_path: "/install"

# The name of the SAPCAR executable file (String).
sap_patching_sapcar_file_name: SAPCAR.EXE

# The name of operating system user which owns all extracted files (String).
# Defaults to '<sid>adm' user and can be changed to shared user if NFS share is used.
# If the prepare (extraction) is executed on the controller node and <sid>adm is not available, root can be used
sap_patching_file_owner: "{{ sap_patching_sap_system_sid | lower }}adm"

# The name of operating system group which owns all extracted files (String).
# Defaults to 'sapsys' group.
sap_patching_file_group: sapsys


### Kernel patching settings

# The path to base kernel directory where version specific directories will be created during the prepare step (String).
# Used when 'sap_patching_kernel_files_on_target' is set to 'true'.
# If 'sap_patching_kernel_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_kernel_base: ''  # e.g. /install/kernel

# The path to directory where the kernel files are located on managed nodes (String).
# Used when 'sap_patching_kernel_files_on_target' is set to 'true'.
# If 'sap_patching_kernel_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_kernel_source: ''  # e.g. "/install/kernel/source"

# The path to directory where the kernel files are located on Control node (localhost) (String).
# Used when 'sap_patching_kernel_files_on_target' is set to 'false'.
# Kernel files will be copied from this path on the control node to 'sap_patching_kernel_source' on the managed nodes during prepare step.
sap_patching_kernel_source_local: ''  # e.g. "/install/kernel/source"

# The name of kernel release version to use during preparation (String).
# Defaults to 'autodetect', which will detect version from extracted 'disp+work' file.
# Alternative: specify exact kernel version e.g. '793' (format: '<NNN>' where N is a number).
# The kernel patch will be determined from the name of the SAR files.
sap_patching_kernel_prepare_version: autodetect

# The name of directory either relative to 'sap_patching_kernel_base' or absolute path to the kernel (String).
# If not set, the task 'abap_kernel_prepare' will populate correct directory,
# or fall back to 'sap_patching_kernel_to_apply_symlink'.
sap_patching_kernel_to_apply: ''

# Select whether the kernel files are already present on the managed nodes (Boolean).
# If 'true', the kernel files are already on managed nodes (e.g., pre-staged to NFS or local disk)
#   and the prepare step will verify files exist and extract them in place.
# If 'false', the kernel files are on the control node and must be copied to managed nodes
#   and the prepare step will copy files from 'sap_patching_kernel_source_local' to managed nodes.
sap_patching_kernel_files_on_target: true

# Select whether the kernel files will be shared among multiple hosts (Boolean).
# If 'true', the kernel files will copied and extracted only once, because target host is expected to be shared.
# If 'false', the kernel files will copied and extracted on all target hosts separately.
# NOTE: Existing shared filesystem is expected to be present and accessible by all hosts if 'true'.
sap_patching_kernel_files_shared: true

# The name of restart strategy during kernel patching (String).
# Options:
# - 'all' - Restart the whole system including SapStartService
# - 'rks' - Restart using Rolling Kernel Switch (RKS)
# - 'bootstrap' - Restart only sapstartsrv and run sapcpe
# NOTE: Ensure that your SAP System is compatible with RKS. If not, use 'all' strategy.
sap_patching_kernel_restart_strategy: rks

## Append-to mode variables:
# The name of kernel release and patch to apply in format '<kernel_version>p<patch_number>' e.g. 793p320 (String).
# To be used when not patching dw or SAPEXE e.g. when adding extra patch like R3trans to existing kernel patch
sap_patching_kernel_prepare_append_to_version: ''


### HDB client patching settings

# Mandatory: HDB client patching uses 'sap_patching_sap_system_sid' when executing 'hdbinst' command.

# The path to base HDB client directory where version specific directories will be created during the prepare step (String).
# Used when 'sap_patching_hdb_client_files_on_target' is set to 'true'.
# If 'sap_patching_hdb_client_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_hdb_client_base: ''  # e.g. /install/hana/client

# The path to directory where the HDB client files are located on managed nodes (String).
# Used when 'sap_patching_hdb_client_files_on_target' is set to 'true'.
# If 'sap_patching_hdb_client_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_hdb_client_source: ''  # e.g. /install/hana/client/source

# The path to directory where the HDB client files are located on Control node (localhost) (String).
# Used when 'sap_patching_hdb_client_files_on_target' is set to 'false'.
# HDB client files will be copied from this path on the control node to 'sap_patching_hdb_client_source' on the managed nodes during prepare step.
sap_patching_hdb_client_source_local: ''  # e.g. "/install/hana/client/source"

# The name of directory either relative to 'sap_patching_hdb_client_base' or absolute path to the HDB client (String).
# If not set, the task 'abap_hdb_client_prepare' will populate correct directory,
# or fall back to 'sap_patching_hdb_client_to_apply_symlink'.
sap_patching_hdb_client_to_apply: ''

# Then path to HDB client directory which will be applied for specific installation (String).
# This is used if specific client installation is being updated, instead of shared installation.
# Sets '--path' parameter for 'hdbinst' command.
# NOTE: Mutually exclusive with 'sap_patching_hdb_client_shared_path', if both are set, the playbook will fail.
sap_patching_hdb_client_install_path:
  "{{ '/usr/sap/' + sap_patching_sap_system_sid | upper + '/hdbclient' }}"

# Then path to HDB client directory which will be applied for shared installation (String).
# This is used if shared client installation is being updated, instead of individual installation.
# Sets '--sapmnt' parameter for 'hdbinst' command.
# NOTE: Mutually exclusive with 'sap_patching_hdb_client_install_path', if both are set, the playbook will fail.
sap_patching_hdb_client_shared_path: ''  # e.g. /usr/sap/hdbclient

# Select whether the HDB client files are already present on the managed nodes (Boolean).
# If 'true', the HDB client files are already on managed nodes (e.g., pre-staged to NFS or local disk)
#   and the prepare step will verify files exist and extract them in place.
# If 'false', the HDB client files are on the control node and must be copied to managed nodes
#   and the prepare step will copy files from 'sap_patching_hdb_client_source_local' to managed nodes.
sap_patching_hdb_client_files_on_target: true

# Select whether the HDB client files will be shared among multiple hosts (Boolean).
# If 'true', the HDB client files will copied and extracted only once, because target host is expected to be shared.
# If 'false', the HDB client files will copied and extracted on all target hosts separately.
# NOTE: Existing shared filesystem is expected to be present and accessible by all hosts if 'true'.
sap_patching_hdb_client_files_shared: true


### HDB server patching settings

# The SAP HANA Database System ID (SID) (String).
# NOTE: Must be set if using database with different SID than 'sap_patching_sap_system_sid'.
sap_patching_hdb_system_sid: ''

# The path to base HDB server directory where version specific directories will be created during the prepare step (String).
# Used when 'sap_patching_hdb_server_files_on_target' is set to 'true'.
# If 'sap_patching_hdb_server_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_hdb_server_base: ''  # e.g. /install/hana/server

# The path to directory where the HDB server files are located on managed nodes (String).
# Used when 'sap_patching_hdb_server_files_on_target' is set to 'true'.
# If 'sap_patching_hdb_server_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_hdb_server_source: ''  # e.g. /install/hana/server/source

# The path to directory where the HDB server files are located on Control node (localhost) (String).
# Used when 'sap_patching_hdb_server_files_on_target' is set to 'false'.
# HDB server files will be copied from this path on the control node to 'sap_patching_hdb_server_source' on the managed nodes during prepare step.
sap_patching_hdb_server_source_local: ''  # e.g. "/install/hana/server/source"

# The name of directory either relative to 'sap_patching_hdb_server_base' or absolute path to the HDB server (String).
# If not set, the task 'abap_hdb_server_prepare' will populate correct directory,
# or fall back to 'sap_patching_hdb_server_to_apply_symlink'.
sap_patching_hdb_server_to_apply: ''

# The path to HDB server installation (String).
# Defaults to '/usr/sap/<SID>/SYS/exe/hdb' which is the default installation path for HDB server.
sap_patching_hdb_server_install_path:
  "{{ '/usr/sap/' + sap_patching_hdb_system_sid | upper + '/SYS/exe/hdb' }}"

## HDB configfile parameters:

# The name of database user to use for patching (String).
# This is parameter in hdblcm configfile template.
# Documentation: https://help.sap.com/docs/SAP_HANA_PLATFORM/2c1988d620e04368aa4103bf26f17727/df3de8c31cef45c0847d2804b97604ea.html
# NOTE: See documentation for limitations like XSA update not working with this option.
# sap_patching_hdb_server_cf_system_user: ''

# The password of database user defined in 'sap_patching_hdb_server_cf_system_user' to use for patching (String).
# This is parameter in hdblcm configfile template.
# Documentation: https://help.sap.com/docs/SAP_HANA_PLATFORM/2c1988d620e04368aa4103bf26f17727/df3de8c31cef45c0847d2804b97604ea.html
# NOTE: See documentation for limitations like XSA update not working with this option.
# sap_patching_hdb_server_cf_system_user_password: ''

## User activation variables
# Set to 'true' if system user (SYSTEM) needs to be activated prior to patching (Boolean).
sap_patching_hdb_server_activate_system_user: true

# The name of SAP HANA admin user store key (hdbuserstore) to use when activating the SYSTEM user (String).
# If not set, falls back to 'sap_patching_hdb_server_activate_admin_user' and 'sap_patching_hdb_server_activate_admin_password'.
sap_patching_hdb_server_activate_admin_userstore_key: ''

# The name of SAP HANA admin user to use when activating the SYSTEM user (String).
sap_patching_hdb_server_activate_admin_user: ''

# The password of the 'sap_patching_hdb_server_activate_admin_user' user used when activating the SYSTEM user (String).
sap_patching_hdb_server_activate_admin_password: ''

# Set to 'true' if the database is clustered so Ansible Role can manage cluster maintenance during patching.
# Cluster steps are available for: Red Hat (pcs), SUSE (crmsh).
sap_patching_hdb_server_is_clustered: false

# The name of cluster resource for HDB server that will be managed by this role (String).
# Examples for SID 'H01' and instance number '90':
# - Clone for 'SAPHanaController' resource agent in SAPHanaSR-angi cluster.
#   - SUSE: 'mst_SAPHanaCon_H01_HDB90'
#   - Red Hat: 'cln_SAPHanaCon_H01_HDB90'
# - Clone for 'SAPHana' resource agent in SAPHanaSR classic cluster.
#   - SUSE: 'mls_SAPHana_H01_HDB90'
#   - Red Hat: 'cln_SAPHana_H01_HDB90'
# Default value belongs to 'SAPHanaSR-angi' version with instance number '00',
# because this role does not use instance number variable.
sap_patching_hdb_server_cluster_hdb_resource_name:
  "cln_SAPHanaCon_{{ sap_patching_hdb_system_sid | upper }}_HDB00"

# Select whether the HDB server files are already present on the managed nodes (Boolean).
# If 'true', the HDB server files are already on managed nodes (e.g., pre-staged to NFS or local disk)
#   and the prepare step will verify files exist and extract them in place.
# If 'false', the HDB server files are on the control node and must be copied to managed nodes
#   and the prepare step will copy files from 'sap_patching_hdb_server_source_local' to managed nodes.
sap_patching_hdb_server_files_on_target: true

# Select whether the HDB server files will be shared among multiple hosts (Boolean).
# If 'true', the HDB server files will copied and extracted only once, because target host is expected to be shared.
# If 'false', the HDB server files will copied and extracted on all target hosts separately.
# NOTE: Existing shared filesystem is expected to be present and accessible by all hosts if 'true'.
sap_patching_hdb_server_files_shared: true


### Host agent patching settings

# Documentation: https://help.sap.com/docs/host-agent/sap-host-agent-doc/sap-host-agent-upgrade?locale=en-US

# The path to base host agent directory where version specific directories will be created during the prepare step (String).
# Used when 'sap_patching_host_agent_files_on_target' is set to 'true'.
# If 'sap_patching_host_agent_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_host_agent_base: ''  # e.g. /install/host_agent

# The path to directory where the host agent files are located on managed nodes (String).
# Used when 'sap_patching_host_agent_files_on_target' is set to 'true'.
# If 'sap_patching_host_agent_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_host_agent_source: ''  # e.g. /install/host_agent/source"

# The path to directory where the host agent files are located on Control node (localhost) (String).
# Used when 'sap_patching_host_agent_files_on_target' is set to 'false'.
# Host agent files will be copied from this path on the control node to 'sap_patching_host_agent_source' on the managed nodes during prepare step.
sap_patching_host_agent_source_local: ''  # e.g. "/install/host_agent/source"

# The name of directory either relative to 'sap_patching_host_agent_base' or absolute path to the host agent (String).
# If not set, the task 'host_agent_prepare' will populate correct directory,
# or fall back to 'sap_patching_host_agent_to_apply_symlink'.
sap_patching_host_agent_to_apply: ''

# The path to directory where host agent installation is located when using 'autoupdate' (String).
# If host agent autoupdate is configured (https://me.sap.com/notes/1473974),
# this is the path where it's looking for updates (parameter DIR_NEW in host_profile).
sap_patching_host_agent_autoupdate_path: ''  # e.g. /install/HostAgentUpdateDir

# Select whether the host agent files are already present on the managed nodes (Boolean).
# If 'true', the host agent files are already on managed nodes (e.g., pre-staged to NFS or local disk)
#   and the prepare step will verify files exist and extract them in place.
# If 'false', the host agent files are on the control node and must be copied to managed nodes
#   and the prepare step will copy files from 'sap_patching_host_agent_source_local' to managed nodes.
sap_patching_host_agent_files_on_target: true

# Select whether the host agent files will be shared among multiple hosts (Boolean).
# Single purpose variable for presence of patching files on hosts, because host agent is always installed locally.
# If 'true', the host agent files will copied and extracted only once, because target host is expected to be shared.
# If 'false', the host agent files will copied and extracted on all target hosts separately.
# NOTE: Existing shared filesystem is expected to be present and accessible by all hosts if 'true'.
sap_patching_host_agent_files_shared: true


### Web disp patching settings

# SAP Web Dispatcher System ID (SID) (String).
# Separate from 'sap_patching_sap_system_sid' because Web Dispatcher can be installed on different SID than ABAP system.
sap_patching_wdp_system_sid: ''

# The path to base web dispatcher directory where version specific directories will be created during the prepare step (String).
# Used when 'sap_patching_webdisp_files_on_target' is set to 'true'.
# If 'sap_patching_webdisp_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_webdisp_base: ''  # e.g. /install/webdisp

# The path to directory where the web dispatcher files are located on managed nodes (String).
# Used when 'sap_patching_webdisp_files_on_target' is set to 'true'.
# If 'sap_patching_webdisp_files_shared' is 'true', this path should point to a shared filesystem accessible by all hosts.
sap_patching_webdisp_source: ''  # e.g.  /install/webdisp/source

# The path to directory where the web dispatcher files are located on Control node (localhost) (String).
# Used when 'sap_patching_webdisp_files_on_target' is set to 'false'.
# Web dispatcher files will be copied from this path on the control node to 'sap_patching_webdisp_source' on the managed nodes during prepare step.
sap_patching_webdisp_source_local: ''  # e.g. "/install/webdisp/source"

# The name of directory either relative to 'sap_patching_webdisp_base' or absolute path to the web dispatcher (String).
# If not set, the task 'webdisp_prepare' will populate correct directory,
# or fall back to 'sap_patching_webdisp_to_apply_symlink'.
sap_patching_webdisp_to_apply: ''

# Select whether the web dispatcher files are already present on the managed nodes (Boolean).
# If 'true', the web dispatcher files are already on managed nodes (e.g., pre-staged to NFS or local disk)
#   and the prepare step will verify files exist and extract them in place.
# If 'false', the web dispatcher files are on the control node and must be copied to managed nodes
#   and the prepare step will copy files from 'sap_patching_webdisp_source_local' to managed nodes.
sap_patching_webdisp_files_on_target: true

# Select whether the web dispatcher files will be shared among multiple hosts (Boolean).
# If 'true', the web dispatcher files will copied and extracted only once, because target host is expected to be shared.
# If 'false', the web dispatcher files will copied and extracted on all target hosts separately.
# NOTE: Existing shared filesystem is expected to be present and accessible by all hosts if 'true'.
sap_patching_webdisp_files_shared: true


### Optional fine tuning variables

# Changing following variables is generally not recommended as they are set to optimal values for most use cases.
# Change only if you know what you are doing and have specific reason to do so.

## Rolling Kernel Switch (RKS) parameters
# See https://help.sap.com/docs/ABAP_PLATFORM_NEW/1ba3197c1aa7489882770103e3a610dc/78cf5bf734c9419e82e7bac87daa7e60.html?locale=en-US
# RKS start wait timeout in seconds - must be more than rdisp/server_startup/max_time (default is 600 seconds)
sap_patching_kernel_rks_wait_timeout: 900
# RKS soft shutdown timeout in seconds - must be more than rdisp/shutdown/max_time (default is 3600 seconds)
sap_patching_kernel_rks_soft_timeout: 3600
# Optional override for UpdateSystem function, that must be used with caution, because it can ignore RKS requirements.
# Force mode is automatically used when HA is detected by sapcontrol.
sap_patching_kernel_rks_force: false

# Name of symbolic link to point to the folder to be used by the patching process
sap_patching_kernel_to_apply_symlink: ansible_to_apply
sap_patching_hdb_client_to_apply_symlink: ansible_to_apply
sap_patching_hdb_server_to_apply_symlink: ansible_to_apply
sap_patching_host_agent_to_apply_symlink: ansible_to_apply
sap_patching_webdisp_to_apply_symlink: ansible_to_apply
