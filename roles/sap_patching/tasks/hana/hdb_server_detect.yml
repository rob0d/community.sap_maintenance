---

# Determines on which hosts in play the HDB server is installed and elects the primary host.
# Executed on all hosts in play, so it must never be limited by 'run_once'.
# NOTE: Election relies on the default 'linear' strategy, where all hosts complete the detection
# tasks before any host builds the list. Election is not deterministic with 'strategy: free'.
# The same installation signal is used by the apply step ('hdbdaemon'/'hdbindexserver' in the install path).

- name: SAP Patching - HDB Server - Detect - Stat availability of {{ sap_patching_hdb_server_install_path }}
  ansible.builtin.stat:
    path: "{{ sap_patching_hdb_server_install_path }}"
  register: __sap_patching_register_hdb_server_install_path_stat

- name: SAP Patching - HDB Server - Detect - Find files in {{ sap_patching_hdb_server_install_path }}
  ansible.builtin.find:
    paths: "{{ sap_patching_hdb_server_install_path }}"
    file_type: any
  register: __sap_patching_register_hdb_server_detect_path_files
  when:
    - __sap_patching_register_hdb_server_install_path_stat.stat.exists
    - __sap_patching_register_hdb_server_install_path_stat.stat.islnk
      or __sap_patching_register_hdb_server_install_path_stat.stat.isdir

# Fact is set unconditionally, so that the value from previously executed plan steps is overwritten.
- name: SAP Patching - HDB Server - Detect - Set fact if the HDB server is installed on this host
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_server_installed:
      "{{ 'hdbdaemon' in __basename_list and 'hdbindexserver' in __basename_list }}"
  vars:
    __basename_list: >-
      {{ __sap_patching_register_hdb_server_detect_path_files.files | d([])
         | map(attribute='path') | map('basename') | list }}

# Detection is never fatal, so that a single play can contain hosts of different roles.
# A failure here would remove the host from 'ansible_play_hosts' and therefore cancel
# all remaining steps of the execution plan for that host, even the unrelated ones.
# Broken installations are reported and skipped, and a re-run after fixing them patches the host,
# because both prepare and apply are idempotent.
- name: SAP Patching - HDB Server - Detect - Warning that the HDB server patching is skipped on this host
  ansible.builtin.debug:
    msg: |
      {% if not __sap_patching_register_hdb_server_install_path_stat.stat.exists %}
      WARN: The HDB server directory "{{ sap_patching_hdb_server_install_path }}" was not found,
      so the HDB server patching is skipped on this host.
      {% else %}
      WARN: The HDB server directory "{{ sap_patching_hdb_server_install_path }}" was found, but it does not
      contain a valid HDB server installation, so the HDB server patching is skipped on this host.
      Ensure that the path points to a valid HDB server installation,
      where 'hdbdaemon' and 'hdbindexserver' executables are present.
      {% endif %}
      Directory is defined in the variable 'sap_patching_hdb_server_install_path'.
  when: not __sap_patching_fact_hdb_server_installed

# Every host builds the same list from 'hostvars', so neither 'run_once' nor delegation is needed.
# 'ansible_play_hosts' excludes failed and unreachable hosts, so those are never elected.
- name: SAP Patching - HDB Server - Detect - Set fact with hosts in play where the HDB server is installed
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_server_hosts: >-
      {{ ansible_play_hosts
         | map('extract', hostvars)
         | selectattr('__sap_patching_fact_hdb_server_installed', 'defined')
         | selectattr('__sap_patching_fact_hdb_server_installed')
         | map(attribute='inventory_hostname')
         | list }}

- name: SAP Patching - HDB Server - Detect - Set fact with the primary host for a shared staging area
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_server_primary_host: "{{ __sap_patching_fact_hdb_server_hosts | first | d('') }}"
