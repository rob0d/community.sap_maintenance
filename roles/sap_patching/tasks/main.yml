#   loop_control:
#     label: "Executing step: {{ item }}"
#   when: "sap_patching_exec_def[item].where | from_yaml"

- name: Looping through the execution plan
  ansible.builtin.include_tasks:
    file: main_loop.yml

  loop: "{{ sap_patching_execution_plan }}"
  loop_control:
    loop_var: sap_patching_step
    label: "Executing step: {{ sap_patching_step }}"
  #when: "sap_patching_exec_def[sap_patching_step].where | from_yaml"
