---

- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_file_owner' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_file_owner is defined
      - sap_patching_file_owner is string
      - sap_patching_file_owner | length > 0
    fail_msg: |
      The variable 'sap_patching_file_owner' is undefined, empty, or invalid.
      It should be a string containing a valid user.

- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_file_owner' contains valid user
  ansible.builtin.assert:
    that:
      - ansible_facts["getent_passwd"][sap_patching_file_owner] is defined
    fail_msg: |
      FAIL: The variable 'sap_patching_file_owner' must be set to a valid user on the system.
      The current value '{{ sap_patching_file_owner }}' does not correspond to any user on the system.


- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_file_group' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_file_group is defined
      - sap_patching_file_group is string
      - sap_patching_file_group | length > 0
    fail_msg: |
      The variable 'sap_patching_file_group' is undefined, empty, or invalid.
      It should be a string containing a valid group.

- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_file_group' contains valid group
  ansible.builtin.assert:
    that:
      - ansible_facts["getent_group"][sap_patching_file_group] is defined
    fail_msg: |
      FAIL: The variable 'sap_patching_file_group' must be set to a valid group on the system.
      The current value '{{ sap_patching_file_group }}' does not correspond to any group on the system.


- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_host_agent_base' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_host_agent_base is defined
      - sap_patching_host_agent_base is string
      - sap_patching_host_agent_base | length > 0
      - sap_patching_host_agent_base is match('^/')
    fail_msg: |
      The variable 'sap_patching_host_agent_base' is undefined, empty, or invalid.
      It should be an absolute path (starting with /) where host agent SAR files are stored and extraction directories are created.

- name: SAP Patching - Validation - Host Agent - Stat availability of the path in the variable 'sap_patching_host_agent_base'
  ansible.builtin.stat:
    path: "{{ sap_patching_host_agent_base }}"
  register: __sap_patching_register_host_agent_base_stat

- name: SAP Patching - Validation - Host Agent - Fail if path in the variable 'sap_patching_host_agent_base' does not exist as a directory
  ansible.builtin.fail:
    msg: |
      FAIL: The path "{{ sap_patching_host_agent_base }}" does not exist or is not a directory.
      Please ensure that the Host Agent base path is correct and accessible.
  when: not (__sap_patching_register_host_agent_base_stat.stat.exists
          and __sap_patching_register_host_agent_base_stat.stat.isdir)


- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_host_agent_source' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_host_agent_source is defined
      - sap_patching_host_agent_source is string
      - sap_patching_host_agent_source | length > 0
    fail_msg: |
      The variable 'sap_patching_host_agent_source' is undefined, empty, or invalid.
      It should be a path where the host agent SAR files are located (used during the prepare step).

- name: SAP Patching - Validation - Host Agent - Stat availability of the path in the variable 'sap_patching_host_agent_source'
  ansible.builtin.stat:
    path: "{{ sap_patching_host_agent_source }}"
  register: __sap_patching_register_host_agent_source_stat

- name: SAP Patching - Validation - Host Agent - Fail if path in the variable 'sap_patching_host_agent_source' does not exist as a directory
  ansible.builtin.fail:
    msg: |
      FAIL: The path "{{ sap_patching_host_agent_source }}" does not exist or is not a directory.
      Please ensure that the Host Agent source path is correct and accessible.
  when: not (__sap_patching_register_host_agent_source_stat.stat.exists
          and __sap_patching_register_host_agent_source_stat.stat.isdir)


- name: Block when update mode is auto
  when: __sap_patching_exec_def[validation_item].vars.update_mode | d('') == 'auto'
  block:
    - name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_host_agent_autoupdate_path' is defined as valid string
      ansible.builtin.assert:
        that:
          - sap_patching_host_agent_autoupdate_path is defined
          - sap_patching_host_agent_autoupdate_path is string
          - sap_patching_host_agent_autoupdate_path | length > 0
          - sap_patching_host_agent_autoupdate_path is match('^/')
        fail_msg: |
          The variable 'sap_patching_host_agent_autoupdate_path' is undefined, empty, or invalid.
          It should be an absolute path (starting with /) where host agent autoupdate looks for updates (parameter DIR_NEW in host_profile).

    - name: SAP Patching - Validation - Host Agent - Stat availability of the path in the variable 'sap_patching_host_agent_autoupdate_path'
      ansible.builtin.stat:
        path: "{{ sap_patching_host_agent_autoupdate_path }}"
      register: __sap_patching_register_host_agent_autoupdate_path_stat

    - name: SAP Patching - Validation - Host Agent - Fail if path in the variable 'sap_patching_host_agent_autoupdate_path' does not exist as a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_host_agent_autoupdate_path }}" does not exist or is not a directory.
          Please ensure that the Host Agent autoupdate path is correct and accessible.
      when: not (__sap_patching_register_host_agent_autoupdate_path_stat.stat.exists
              and __sap_patching_register_host_agent_autoupdate_path_stat.stat.isdir)


- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_host_agent_extracted_shared' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_host_agent_extracted_shared is defined
      - sap_patching_host_agent_extracted_shared is boolean
    fail_msg: |
      The variable 'sap_patching_host_agent_extracted_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating if extracted host agent files are on shared storage (e.g. NFS share).

- name: Block when sap_patching_host_agent_extracted_shared is false
  when: not sap_patching_host_agent_extracted_shared
  block:
    - name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_host_agent_extracted_local_path' is defined as valid string
      ansible.builtin.assert:
        that:
          - sap_patching_host_agent_extracted_local_path is defined
          - sap_patching_host_agent_extracted_local_path is string
          - sap_patching_host_agent_extracted_local_path | length > 0
          - sap_patching_host_agent_extracted_local_path is match('^/')
        fail_msg: |
          The variable 'sap_patching_host_agent_extracted_local_path' is undefined, empty, or invalid.
          It should be an absolute path (starting with /) where a local copy of extracted host agent files is stored to run saphostexec.

    - name: SAP Patching - Validation - Host Agent - Stat availability of the path in the variable 'sap_patching_host_agent_extracted_local_path'
      ansible.builtin.stat:
        path: "{{ sap_patching_host_agent_extracted_local_path }}"
      register: __sap_patching_register_host_agent_extracted_local_path_stat

    - name: SAP Patching - Validation - Host Agent - Fail if path in the variable 'sap_patching_host_agent_extracted_local_path' does not exist as a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_host_agent_extracted_local_path }}" does not exist or is not a directory.
          Please ensure that the Host Agent extracted local path is correct and accessible.
      when: not (__sap_patching_register_host_agent_extracted_local_path_stat.stat.exists
              and __sap_patching_register_host_agent_extracted_local_path_stat.stat.isdir)


- name: SAP Patching - Validation - Host Agent - Assert that the variable 'sap_patching_webdisp_extracted_shared' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_webdisp_extracted_shared is defined
      - sap_patching_webdisp_extracted_shared is boolean
    fail_msg: |
      The variable 'sap_patching_webdisp_extracted_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating if extracted Web Dispatcher source files are on shared storage (e.g. NFS share).

# We do not check if it is empty string, because detection will populate it.
- name: SAP Patching - Validation - Web Dispatcher - Assert that the variable 'sap_patching_webdisp_to_apply' is defined as string
  ansible.builtin.assert:
    that:
      - sap_patching_webdisp_to_apply is defined
      - sap_patching_webdisp_to_apply is string
    fail_msg: |
      The variable 'sap_patching_webdisp_to_apply' is undefined or invalid.
      It should be either empty string (to use default symlink) or a path to the Web Dispatcher to be applied.


- name: SAP Patching - Validation - Host Agent - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
