---

# Facts are not set here to ensure that they do not influence other plan steps,
# instead they are set temporarily in vars section of include_tasks.

- name: SAP Patching - Kernel - Apply - Execute shared tasks for kernel apply
  ansible.builtin.include_tasks:
    file: shared_kernel_apply.yml
  vars:
    __sap_patching_fact_sap_system_sid: "{{ sap_patching_sap_system_sid | upper }}"
    __sap_patching_fact_sidadm_user: "{{ sap_patching_sap_system_sid | lower }}adm"
    __sap_patching_fact_kernel_base: "{{ __sap_patching_kernel_base }}"
    __sap_patching_fact_kernel_files_shared: "{{ sap_patching_kernel_files_shared }}"
    __sap_patching_fact_kernel_type: "abap_kernel"
    # Temporary assignments for passing prepared facts from prepare tasks without affecting user variables.
    __sap_patching_fact_kernel_to_apply_user: "{{ sap_patching_kernel_to_apply | d('') }}"
    __sap_patching_fact_kernel_to_apply_prepare: "{{ __sap_patching_fact_kernel_to_apply | d('') }}"
    __sap_patching_fact_kernel_to_apply_symlink_user: "{{ sap_patching_kernel_to_apply_symlink }}"
