---

- name: SAP Patching - Validation - Web Dispatcher - Assert that the variable 'sap_patching_wdp_system_sid' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_wdp_system_sid is defined
      - sap_patching_wdp_system_sid is string
      - sap_patching_wdp_system_sid | length  == 0 or (sap_patching_wdp_system_sid | length == 3 and sap_patching_wdp_system_sid.isupper())
    fail_msg: |
      The variable 'sap_patching_wdp_system_sid' is undefined, not upper case, not 3 characters long or invalid.
      It should be a either empty string (if not required in the execution plan) or a valid SAP system SID (3 characters).


- name: SAP Patching - Validation - Web Dispatcher - Assert that the variable 'sap_patching_webdisp_base' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_webdisp_base is defined
      - sap_patching_webdisp_base is string
      - sap_patching_webdisp_base | length > 0
      - sap_patching_webdisp_base is match('^/')
    fail_msg: |
      The variable 'sap_patching_webdisp_base' is undefined, empty, or invalid.
      It should be an absolute path (starting with /) where web dispatcher SAR files are stored and extraction directories are created.

- name: SAP Patching - Validation - Web Dispatcher - Check if path in the variable 'sap_patching_webdisp_base' exists and is a directory
  ansible.builtin.stat:
    path: "{{ sap_patching_webdisp_base }}"
  register: __sap_patching_register_webdisp_base_stat
  failed_when:
    - not (__sap_patching_register_webdisp_base_stat.stat.exists
        and __sap_patching_register_webdisp_base_stat.stat.isdir)


- name: SAP Patching - Validation - Web Dispatcher - Assert that the variable 'sap_patching_webdisp_source' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_webdisp_source is defined
      - sap_patching_webdisp_source is string
      - sap_patching_webdisp_source | length > 0
    fail_msg: |
      The variable 'sap_patching_webdisp_source' is undefined, empty, or invalid.
      It should be a path where the web dispatcher SAR files are located (used during the prepare step).

- name: SAP Patching - Validation - Web Dispatcher - Check if path in the variable 'sap_patching_webdisp_source' exists and is a directory
  ansible.builtin.stat:
    path: "{{ sap_patching_webdisp_source }}"
  register: __sap_patching_register_webdisp_source_stat
  failed_when:
    - not (__sap_patching_register_webdisp_source_stat.stat.exists
        and __sap_patching_register_webdisp_source_stat.stat.isdir)


- name: SAP Patching - Validation - Web Dispatcher - Assert that the variable 'sap_patching_webdisp_extracted_shared' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_webdisp_extracted_shared is defined
      - sap_patching_webdisp_extracted_shared is boolean
    fail_msg: |
      The variable 'sap_patching_webdisp_extracted_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating if extracted web dispatcher files are on shared storage (e.g. NFS share).


- name: SAP Patching - Validation - Web Dispatcher - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
