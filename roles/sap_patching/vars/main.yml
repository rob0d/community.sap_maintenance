# NOTE: Do not change variables in this file as they define how execution steps are executed and validated.
# Variables in this file are not meant to be overridden by users.
# User variables should be defined in the 'defaults/main.yml' file or passed as extra-vars.

### Dictionary of execution steps for the patching process.
## Available keys:
# - file - Path to the task file that implements the step.
# - validators - List of validator files from 'tasks/validations/' executed before the step.
# - vars - Set as '__sap_patching_params' dictionary containing all variables for the task file.
#          Omitted when the task file needs no parameters, so '__sap_patching_params' defaults to an empty dictionary.
# - run_once - Default 'false'. Limits the execution of the step to a single host in play.
#              It cannot describe a complex system with hosts of different roles in a single play.
#              Replaced by detection tasks in the task files, which determine on which hosts in play the component is present
#              and elect a primary host when a shared directory must be patched only once.
## Deprecated keys:
# - where - Defined the host selection for the step, but was removed because it cannot describe a complex system
#           with hosts of different roles in a single play.
# - tags - Not used.

## run_once rules:
# NOTE: The role requires one shared filesystem if 'files_shared' vars are set to 'true'.
# Prepare:
# - All detection and validation tasks are executed on every host in play,
#   which ensures that all of them have access to the files and directories, and that the permissions are correct.
# - The 'files_shared' vars limit the copy and the SAR extraction to a single host on task level,
#   because both of them write into the same shared staging area.
#   The copy from the control node is executed only when the 'files_on_target' vars are set to 'false'.
# Apply and Restart:
# - All detection and validation tasks are executed on every host in play,
#   which helps to determine if component is installed on the host.
# - List of installed hosts is used to elect a primary host for the tasks that must be executed only once.

__sap_patching_exec_def:

  ## ABAP kernel
  abap_kernel_prepare:
    file: nw/abap_kernel_prepare.yml
    validators:
      - prepare
      - abap
      - kernel

  abap_kernel_apply:
    file: nw/abap_kernel_apply.yml
    validators:
      - abap
      - kernel

  # RKS commands are limited on task level to the first host where the kernel was found.
  abap_kernel_restart:
    file: nw/abap_kernel_restart.yml
    validators:
      - abap
      - kernel


  ## HANA DB client
  hdb_client_prepare:
    file: hana/hdb_client_prepare.yml
    validators:
      - prepare
      - hdb_client

  # Installed locally on every host, unless 'sap_patching_hdb_client_shared_path' is defined,
  # then 'hdbinst' is limited on task level to a single host.
  hdb_client_apply:
    file: hana/hdb_client_apply.yml
    validators:
      - hdb_client


  ## HANA DB server platform
  hdb_server_prepare:
    file: hana/hdb_server_prepare.yml
    validators:
      - prepare
      - hdb_server

  # No global directory like ABAP kernel, so patching is executed on all hosts in play.
  hdb_server_apply:
    file: hana/hdb_server_apply.yml
    validators:
      - hdb_server
    vars:
      update_mode: full

  hdb_server_update_prepare:
    file: hana/hdb_server_apply.yml
    validators:
      - hdb_server
    vars:
      update_mode: prepare

  hdb_server_update_resume:
    file: hana/hdb_server_apply.yml
    validators:
      - hdb_server
    vars:
      update_mode: resume


  ## Host agent
  host_agent_prepare:
    file: agents/host_agent_prepare.yml
    validators:
      - prepare
      - host_agent

  # Always installed locally, so patching is executed on all hosts in play.
  host_agent_apply_auto:
    file: agents/host_agent_apply.yml
    validators:
      - host_agent
    vars:
      update_mode: auto

  host_agent_apply_manual:
    file: agents/host_agent_apply.yml
    validators:
      - host_agent
    vars:
      update_mode: manual


  ## Web dispatcher
  webdisp_prepare:
    file: nw/webdisp_prepare.yml
    validators:
      - prepare
      - webdisp

  # Always contains own global exe directory locally, so patching is executed on all hosts in play.
  webdisp_apply:
    file: nw/webdisp_apply.yml
    validators:
      - webdisp

  # Always use the 'all' strategy, so every host in play restarts its own instances.
  webdisp_restart:
    file: nw/webdisp_restart.yml
    validators:
      - webdisp


  ## Standalone tasks - Stop
  abap_stop_system:
    file: startstop/abap_stop.yml
    validators:
      - abap
    vars:
      sap_control_action: stop_system
      task_execution_mode: direct

  # hdb_stop_instance:
  #   file: startstop/hdb_stop.yml
  #   vars:
  #     sap_control_action: stop_instance


  ## Standalone tasks - Start
  abap_start_system:
    file: startstop/abap_start.yml
    validators:
      - abap
    vars:
      sap_control_action: start_system
      task_execution_mode: direct

  # hdb_start_instance:
  #   file: startstop/hdb_start.yml
  #   vars:
  #     sap_control_action: start_instance


# Default sub-folders names which store the extracted files
__sap_patching_kernel_extracted: extracted
__sap_patching_hdb_client_extracted: extracted
__sap_patching_hdb_server_extracted: extracted
__sap_patching_host_agent_extracted: extracted
__sap_patching_webdisp_extracted: extracted

# Default paths without trailing slash
__sap_patching_kernel_source: "{{ sap_patching_kernel_source | regex_replace('\\/$', '') }}"
__sap_patching_kernel_source_local: "{{ sap_patching_kernel_source_local | regex_replace('\\/$', '') }}"
__sap_patching_kernel_base: "{{ sap_patching_kernel_base | regex_replace('\\/$', '') }}"

__sap_patching_hdb_server_source: "{{ sap_patching_hdb_server_source | regex_replace('\\/$', '') }}"
__sap_patching_hdb_server_source_local: "{{ sap_patching_hdb_server_source_local | regex_replace('\\/$', '') }}"
__sap_patching_hdb_server_base: "{{ sap_patching_hdb_server_base | regex_replace('\\/$', '') }}"

__sap_patching_hdb_client_source: "{{ sap_patching_hdb_client_source | regex_replace('\\/$', '') }}"
__sap_patching_hdb_client_source_local: "{{ sap_patching_hdb_client_source_local | regex_replace('\\/$', '') }}"
__sap_patching_hdb_client_base: "{{ sap_patching_hdb_client_base | regex_replace('\\/$', '') }}"

__sap_patching_webdisp_source: "{{ sap_patching_webdisp_source | regex_replace('\\/$', '') }}"
__sap_patching_webdisp_source_local: "{{ sap_patching_webdisp_source_local | regex_replace('\\/$', '') }}"
__sap_patching_webdisp_base: "{{ sap_patching_webdisp_base | regex_replace('\\/$', '') }}"

__sap_patching_host_agent_source: "{{ sap_patching_host_agent_source | regex_replace('\\/$', '') }}"
__sap_patching_host_agent_source_local: "{{ sap_patching_host_agent_source_local | regex_replace('\\/$', '') }}"
__sap_patching_host_agent_base: "{{ sap_patching_host_agent_base | regex_replace('\\/$', '') }}"

__sap_patching_sapcar_path: "{{ sap_patching_sapcar_path | regex_replace('\\/$', '') }}"


# Default boolean variables
__sap_patching_kernel_normal_mode: true
__sap_patching_kernel_append_mode: false
__sap_patching_kernel_delta_mode: false


# Owner of all files created in the staging area.
# Either the user variable 'sap_patching_file_owner', or the '<sap_patching_sap_system_sid>adm' user.
# Option with HDB/WD SID was considered, but it would increase complexity and the risk of errors.
__sap_patching_file_owner: >-
  {{ sap_patching_file_owner
    if sap_patching_file_owner | d('') | trim | length > 0
    else sap_patching_sap_system_sid | lower ~ 'adm' }}
