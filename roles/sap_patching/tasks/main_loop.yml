  ansible.builtin.include_tasks:
    file: "{{ sap_patching_exec_def[sap_patching_step].file }}"
  run_once: "{{ sap_patching_exec_def[sap_patching_step].run_once | default(false) }}"
  vars:
    sap_patching_params: "{{ sap_patching_exec_def[sap_patching_step].vars | default({}) }}"
  tags:
    - always
