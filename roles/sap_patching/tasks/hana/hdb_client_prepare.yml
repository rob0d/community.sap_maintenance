# SPDX-License-Identifier: Apache-2.0
---

- name: SAP Patching - HDB Client - Prepare - Detect hosts where the HDB client is installed
  ansible.builtin.include_tasks:
    file: hdb_client_detect.yml


# Reported once, because every host in play builds the identical list of hosts with the client installed.
# Evaluating 'when' on the first host only is therefore safe, even though it is combined with 'run_once'.
# This is only a warning, so that other plan steps can still be executed.
- name: SAP Patching - HDB Client - Prepare - Warning if the HDB client is not installed on any host in play
  ansible.builtin.debug:
    msg: |
      WARN: The HDB client was not found on any host in play, so there is nothing to prepare.
      If this is unexpected, ensure that the hosts using the HDB client are part of this play
      and that the path "{{ __sap_patching_fact_hdb_client_path }}" is correct.
  run_once: true
  when: __sap_patching_fact_hdb_client_hosts | length == 0


- name: Block for base directory
  # Only hosts where the HDB client is installed prepare it, so a play may contain hosts of other roles.
  when: __sap_patching_fact_hdb_client_installed | d(false)
  block:
    # Stat only on hosts that will create the directory (the primary in shared mode, or every host with a
    # per-host staging area). Non-primary hosts skip this so they do not cache an NFS negative lookup,
    # which is kept for up to 'acdirmax' and would hide the directory the primary is about to create.
    - name: SAP Patching - HDB Client - Prepare - Stat availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_client_base }}"
      register: __sap_patching_register_hdb_client_prepare_base_stat
      when:
        - not sap_patching_hdb_client_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_client_primary_host

    # In shared mode only the primary host creates the directory, so a missing shared mount on another
    # host is reported below instead of being masked by a local directory on the mount point.
    - name: SAP Patching - HDB Client - Prepare - Create base directory with user {{ __sap_patching_file_owner }}
      ansible.builtin.file:
        path: "{{ __sap_patching_hdb_client_base }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not sap_patching_hdb_client_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_client_primary_host
        - not __sap_patching_register_hdb_client_prepare_base_stat.stat.exists

    # Verify the directory is visible on every host, retrying to absorb NFS propagation delay after the
    # primary created it. 'failed_when: false' lets the dedicated task below report a helpful message.
    - name: SAP Patching - HDB Client - Prepare - Verify availability of the base directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_client_base }}"
      register: __sap_patching_register_hdb_client_prepare_base_stat
      until: __sap_patching_register_hdb_client_prepare_base_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false

    - name: SAP Patching - HDB Client - Prepare - Fail if the base directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The base directory "{{ __sap_patching_hdb_client_base }}" is not available on this host.
          {% if sap_patching_hdb_client_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_hdb_client_primary_host }}".
          Ensure the base directory is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_hdb_client_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_hdb_client_prepare_base_stat.stat.exists

    - name: SAP Patching - HDB Client - Prepare - Fail if base directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_hdb_client_base }}" exists but it is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_hdb_client_base' is a directory.
      when: not __sap_patching_register_hdb_client_prepare_base_stat.stat.isdir

    - name: SAP Patching - HDB Client - Prepare - Stat base directory with user {{ __sap_patching_file_owner }}
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_client_base }}"
      register: __sap_patching_register_hdb_client_prepare_base_user_stat
      # Stat with correct user to check permissions.
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    - name: SAP Patching - HDB Client - Prepare - Fail if user cannot write to base directory
      ansible.builtin.fail:
        msg: |
          FAIL: User '{{ __sap_patching_file_owner }}' does not have write permissions
          to the directory '{{ sap_patching_hdb_client_base }}'
          defined in the variable 'sap_patching_hdb_client_base'.

          Ansible cannot create the symlink '{{ sap_patching_hdb_client_to_apply_symlink }}' without write access to this path.
          Please check the directory permissions (chmod/chown).
      when: not __sap_patching_register_hdb_client_prepare_base_user_stat.stat.writeable


- name: Block for source directory
  when: __sap_patching_fact_hdb_client_installed | d(false)
  block:
    # Stat only on creating hosts, so non-primary hosts do not cache an NFS negative lookup
    # (see the base directory block above for the full explanation).
    - name: SAP Patching - HDB Client - Prepare - Stat availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_client_source }}"
      register: __sap_patching_register_hdb_client_prepare_source_stat
      when:
        - not sap_patching_hdb_client_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_client_primary_host

    # In shared mode only the primary host creates the directory, so a missing shared mount on another
    # host is reported below instead of being masked by a local directory on the mount point.
    - name: SAP Patching - HDB Client - Prepare - Create source directory with user {{ __sap_patching_file_owner }}
      ansible.builtin.file:
        path: "{{ __sap_patching_hdb_client_source }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when:
        - not sap_patching_hdb_client_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_client_primary_host
        - not __sap_patching_register_hdb_client_prepare_source_stat.stat.exists

    # Verify the directory is visible on every host, retrying to absorb NFS propagation delay after the
    # primary created it. 'failed_when: false' lets the dedicated task below report a helpful message.
    - name: SAP Patching - HDB Client - Prepare - Verify availability of the source directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_hdb_client_source }}"
      register: __sap_patching_register_hdb_client_prepare_source_stat
      until: __sap_patching_register_hdb_client_prepare_source_stat.stat.exists
      retries: 6
      delay: 5
      failed_when: false

    - name: SAP Patching - HDB Client - Prepare - Fail if the source directory is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The source directory "{{ __sap_patching_hdb_client_source }}" is not available on this host.
          {% if sap_patching_hdb_client_files_shared %}
          It is prepared only on the primary host "{{ __sap_patching_fact_hdb_client_primary_host }}".
          Ensure the source directory is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_hdb_client_files_shared' to 'false' to prepare it on every host separately.
          {% else %}
          Creating the directory failed. Please check the path and the permissions.
          {% endif %}
      when: not __sap_patching_register_hdb_client_prepare_source_stat.stat.exists

    - name: SAP Patching - HDB Client - Prepare - Fail if source directory is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: The path "{{ sap_patching_hdb_client_source }}" exists but it is not a directory.
          Please ensure that the path defined in the variable 'sap_patching_hdb_client_source' is a directory.
      when: not __sap_patching_register_hdb_client_prepare_source_stat.stat.isdir


    # Copy to multiple targets can saturate the control node and the network.
    # With a shared staging area the copy runs only on the elected primary host, because every host
    # sees the same source directory. With a per-host staging area it runs on every installed host,
    # and 'throttle' limits it to one copy at a time so the control node and network are not saturated.
    # Set 'sap_patching_disable_throttle' to 'true' to copy to all hosts in parallel.
    - name: Block for local source directory
      throttle: "{{ 0 if sap_patching_disable_throttle | d(false) else 1 }}"
      when:
        - not sap_patching_hdb_client_files_on_target
        - not sap_patching_hdb_client_files_shared
          or inventory_hostname == __sap_patching_fact_hdb_client_primary_host
      block:
        - name: SAP Patching - HDB Client - Prepare - Stat availability of the local source directory
          ansible.builtin.stat:
            path: "{{ __sap_patching_hdb_client_source_local }}"
          delegate_to: localhost  # Stat should be executed on control node where the files are located
          register: __sap_patching_register_hdb_client_source_local_stat

        - name: SAP Patching - HDB Client - Prepare - Fail if local source directory does not exist
          ansible.builtin.fail:
            msg: |
              FAIL: The path "{{ sap_patching_hdb_client_source_local }}" does not exist or is not a directory.
              Please ensure that the HDB client source path is correct and accessible.
          when: not (__sap_patching_register_hdb_client_source_local_stat.stat.exists
                  and __sap_patching_register_hdb_client_source_local_stat.stat.isdir)

        - name: SAP Patching - HDB Client - Prepare - Copy source files from control node to managed node
          ansible.builtin.copy:
            src: "{{ __sap_patching_hdb_client_source_local }}/"  # Trailing slash is required.
            dest: "{{ __sap_patching_hdb_client_source }}/"
            remote_src: false  # Copy from control node
            mode: '0755'
            owner: "{{ __sap_patching_file_owner }}"
            group: "{{ sap_patching_file_group }}"


# Search for HDB client SAR files and extract support package number.
# Limited to hosts where the HDB client is installed, so it is not searched on hosts of other roles.
- name: SAP Patching - HDB Client - Prepare - Find SAR files in the source directory (case-insensitive)
  ansible.builtin.find:
    paths: "{{ __sap_patching_hdb_client_source }}"
    patterns: ['(?i)IMDB_CLIENT.*\.SAR$']
    use_regex: true
    file_type: file
    recurse: false
  register: __sap_patching_register_hdb_client_source_dir_content
  when: __sap_patching_fact_hdb_client_installed | d(false)


- name: Block to execute only if SAR files were found
  # Preparation runs only on hosts where the HDB client is installed. With a shared staging area it is
  # limited further to the elected primary host, so extraction happens exactly once. With a per-host
  # staging area every installed host extracts its own copy.
  when:
    - __sap_patching_fact_hdb_client_installed | d(false)
    - not sap_patching_hdb_client_files_shared
      or inventory_hostname == __sap_patching_fact_hdb_client_primary_host
    - __sap_patching_register_hdb_client_source_dir_content.matched | d(0) > 0
  block:

    # In case there are more than one SAR files, get the one with the highest version number
    - name: SAP Patching - HDB Client - Prepare - Set fact with the highest version of HDB client SAR file
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_client_sar: >-
          {{
            __sap_patching_register_hdb_client_source_dir_content.files
            | map(attribute='path')
            | map('basename')
            | sort
            | list
            | last
          }}

    # Example: File 'IMDB_CLIENT20_028_17-80002082.SAR' results in version '20_028_17'.
    - name: SAP Patching - HDB Client - Prepare - Set fact with extracted client version from SAR file
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_client_version: >-
          {{
            __sap_patching_fact_hdb_client_sar
              | regex_search('(?i)IMDB_CLIENT([0-9_]+)-[0-9]{8}\.SAR', '\1')
              | d([], true)
              | first
              | d('', true)
          }}

    - name: SAP Patching - HDB Client - Prepare - Fail if no HDB client version could be extracted from SAR file name
      ansible.builtin.fail:
        msg: |
          FAIL: No HDB client version could be extracted from SAR file name '{{ __sap_patching_fact_hdb_client_sar }}'.
          Please ensure that the SAR file name follows the expected pattern.
          Example: File 'IMDB_CLIENT20_028_17-80002082.SAR' results in version '20_028_17'
      when: __sap_patching_fact_hdb_client_version == ''

    - name: SAP Patching - HDB Client - Prepare - Show version extracted from SAR file name
      ansible.builtin.debug:
        msg: >-
          INFO: HDB client version extracted from SAR file name '{{ __sap_patching_fact_hdb_client_sar }}'
          is '{{ __sap_patching_fact_hdb_client_version }}'.
      when: __sap_patching_fact_hdb_client_version != ''

    - name: SAP Patching - HDB Client - Prepare - Set fact with the target HDB client directory
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_client_extract_target:
          "{{ __sap_patching_hdb_client_base }}/{{ __sap_patching_hdb_client_extracted }}_{{ __sap_patching_fact_hdb_client_version }}"


    - name: SAP Patching - HDB Client - Prepare - Create extraction target HDB client directory
      ansible.builtin.file:
        path: "{{ __sap_patching_fact_hdb_client_extract_target }}"
        state: directory
        mode: '0755'
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      when: __sap_patching_fact_hdb_client_version != ''

    - name: SAP Patching - HDB Client - Prepare - Stat availability of the target HDB client directory
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_client_extract_target }}"
      register: __sap_patching_register_hdb_client_extract_target_stat

    - name: SAP Patching - HDB Client - Prepare - Fail if target HDB client directory does not exist or is not a directory
      ansible.builtin.fail:
        msg: |
          FAIL: Target HDB client directory '{{ __sap_patching_fact_hdb_client_extract_target }}' does not exist or is not a directory.
      when: not (__sap_patching_register_hdb_client_extract_target_stat.stat.exists
              and __sap_patching_register_hdb_client_extract_target_stat.stat.isdir)

    # Shell is used instead of copy/move modules to ensure we can use globbing
    # to copy file in case they are not in capitals as expected.
    # Copy is used to ensure we do not remove source files.
    - name: SAP Patching - HDB Client - Prepare - Copy all files {{ __direction }}
      ansible.builtin.shell:
        cmd: >-
          cp '{{ __sap_patching_hdb_client_source }}'/[Ii][Mm][Dd][Bb]_[Cc][Ll][Ii][Ee][Nn][Tt]*
          '{{ __sap_patching_hdb_client_base }}/'
      vars:
        __direction: "from {{ __sap_patching_hdb_client_source }} to {{ __sap_patching_hdb_client_base }}"
      when: __sap_patching_hdb_client_base != __sap_patching_hdb_client_source
      changed_when: true


    - name: SAP Patching - HDB Client - Prepare - Extract HDB client SAR file to the target
      ansible.builtin.command:
        cmd: >-
          {{ __sap_patching_sapcar_path }}/{{ sap_patching_sapcar_file_name }}
          -xvf {{ __sap_patching_hdb_client_base }}/{{ __sap_patching_fact_hdb_client_sar }}
          -R "{{ __sap_patching_fact_hdb_client_extract_target }}"
          -manifest SIGNATURE.SMF
      register: __sap_patching_register_extract_result
      args:
        chdir: "{{ __sap_patching_fact_hdb_client_extract_target }}"
      become: true
      become_user: "{{ __sap_patching_file_owner }}"
      changed_when: "'SAPCAR: processing archive' in __sap_patching_register_extract_result.stdout"

    - name: SAP Patching - HDB Client - Prepare - Fail if extraction of HDB client SAR file failed
      ansible.builtin.fail:
        msg: |
          FAIL: Extraction of HDB client SAR file '{{ __sap_patching_fact_hdb_client_sar }}' failed.
          SAPCAR output: {{ __sap_patching_register_extract_result.stdout | d('') }}
          SAPCAR error: {{ __sap_patching_register_extract_result.stderr | d('') }}
      when: __sap_patching_register_extract_result.rc != 0


    - name: SAP Patching - HDB Client - Prepare - Stat availability of the HDB client extracted path
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_client_extract_target }}/SAP_HANA_CLIENT/client"
      register: __sap_patching_register_hdb_client_extracted_client_dir_stat

    - name: SAP Patching - HDB Client - Prepare - Fail if HDB client extracted path does not exist or is not a directory
      ansible.builtin.fail:
        msg: >-
          FAIL: HDB client directory '{{ __sap_patching_fact_hdb_client_extract_target }}/SAP_HANA_CLIENT/client'
          does not exist or is not a directory.
      when: not (__sap_patching_register_hdb_client_extracted_client_dir_stat.stat.exists
              and __sap_patching_register_hdb_client_extracted_client_dir_stat.stat.isdir)

    - name: SAP Patching - HDB Client - Prepare - Ensure symbolic link for HDB client directory is correct
      ansible.builtin.file:
        src: "{{ __sap_patching_fact_hdb_client_extract_target }}/SAP_HANA_CLIENT"
        dest: "{{ __sap_patching_hdb_client_base }}/{{ sap_patching_hdb_client_to_apply_symlink }}"
        state: link
        force: true
        owner: "{{ __sap_patching_file_owner }}"
        group: "{{ sap_patching_file_group }}"
      become: true
      become_user: "{{ __sap_patching_file_owner }}"

    # Fact is dedicated to the prepare step, so that the apply step can distinguish between
    # a freshly prepared HDB client and the path resolved from the user variables.
    - name: SAP Patching - HDB Client - Prepare - Set fact with prepared path for further execution tasks
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_client_to_apply_prepared:
          "{{ __sap_patching_fact_hdb_client_extract_target }}/SAP_HANA_CLIENT"


- name: SAP Patching - HDB Client - Prepare - Inform that SAR files were not found
  ansible.builtin.debug:
    msg: |
      No HDB client SAR files found in source directory {{ __sap_patching_hdb_client_source }}.
      Skipping HDB client preparation.
  when:
    - __sap_patching_fact_hdb_client_installed | d(false)
    - __sap_patching_register_hdb_client_source_dir_content.matched | d(0) == 0


# In shared mode the HDB client is prepared only on the primary host, so the remaining installed hosts
# copy the resolved path from it. The staging area is shared, therefore the path is identical and the
# verification block below can confirm that every installed host actually sees the prepared client.
- name: SAP Patching - HDB Client - Prepare - Propagate prepared HDB client path from the primary host
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_client_to_apply_prepared:
      "{{ hostvars[__sap_patching_fact_hdb_client_primary_host]['__sap_patching_fact_hdb_client_to_apply_prepared'] }}"
  when:
    - __sap_patching_fact_hdb_client_installed | d(false)
    - sap_patching_hdb_client_files_shared
    - inventory_hostname != __sap_patching_fact_hdb_client_primary_host
    - hostvars[__sap_patching_fact_hdb_client_primary_host]['__sap_patching_fact_hdb_client_to_apply_prepared'] is defined


# Executed on every host with the HDB client installed, because extraction above can be limited
# to the elected primary host. This is the only check proving that the base directory is really shared.
- name: Block for all hosts
  when:
    - __sap_patching_fact_hdb_client_installed | d(false)
    - __sap_patching_fact_hdb_client_to_apply_prepared is defined
  block:

    - name: SAP Patching - HDB Client - Prepare - Stat prepared HDB client directory on all hosts
      ansible.builtin.stat:
        path: "{{ __sap_patching_fact_hdb_client_to_apply_prepared }}/hdbinst"
      register: __sap_patching_register_hdb_client_prepared_stat

    - name: SAP Patching - HDB Client - Prepare - Fail if prepared HDB client is not available on this host
      ansible.builtin.fail:
        msg: |
          FAIL: The prepared HDB client "{{ __sap_patching_fact_hdb_client_to_apply_prepared }}" is not available on this host.
          HDB client was prepared only on the elected primary host "{{ __sap_patching_fact_hdb_client_primary_host }}",
          because the variable 'sap_patching_hdb_client_files_shared' is set to 'true'.

          Please ensure that the path defined in the variable 'sap_patching_hdb_client_base'
          is on a shared filesystem mounted on all hosts,
          or set 'sap_patching_hdb_client_files_shared' to 'false' to prepare the HDB client on every host separately.
      when: not __sap_patching_register_hdb_client_prepared_stat.stat.exists
