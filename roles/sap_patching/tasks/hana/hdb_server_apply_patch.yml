# SPDX-License-Identifier: Apache-2.0
---

- name: Block to propagate delegated host to all tasks in this block
  delegate_to: "{{ __sap_patching_delegated_hdb_server_host }}"
  # delegate_facts: true
  block:
    - name: SAP Patching - HDB Server - Apply - Show host and site information
      ansible.builtin.debug:
        msg: |
          {% if __sap_patching_fact_hdb_hsr_enabled %}
          INFO: Patching HDB server '{{ __sap_patching_delegated_hdb_server_host }}' on site '{{ __sap_patching_hdb_hsr_site[0] }}'.
          {% else %}
          INFO: Patching HDB server '{{ __sap_patching_delegated_hdb_server_host }}' (no HSR).
          {% endif %}

    - name: SAP Patching - HDB Server - Apply - Set fact with 'hdblcm' action parameter
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_hdblcm_action: >-
          {% if __sap_patching_params.update_mode | d('') == 'prepare' %}
          --action=update --prepare_update
          {% else %}
          --action=update
          {% endif %}
    # {% elif __sap_patching_params.update_mode == 'resume' %}
    # --action=update --resume_update

    # If clustered and not in prepare mode then put cluster in maintenance mode
    # 'false/true' are strings, not booleans
    - name: SAP Patching - HDB Server - Apply - Cluster - Enable maintenance mode for SAP HANA resource
      run_once: true
      ansible.builtin.include_tasks:
        file: "{{ ansible_facts['os_family'] }}/cluster_maintenance.yml"
      vars:
        __hdb_server_cluster_maintenance_op: 'true'
      when:
        - sap_patching_hdb_server_is_clustered
        - __sap_patching_params.update_mode | d('') != 'prepare'


    - name: SAP Patching - HDB Server - Apply - Include task file to generate hdblcm config file template
      ansible.builtin.include_tasks:
        file: hdblcm_configfile.yml


    - name: SAP Patching - HDB Server - Apply - Update HDB server using 'hdblcm'
      ansible.builtin.command:
        cmd: >-
          '{{ sap_patching_hdb_server_to_apply }}/hdblcm'
          {{ __sap_patching_fact_hdb_server_hdblcm_action }}
          -s {{ sap_patching_hdb_system_sid }}
          --batch
          {{ '--system_user=' + sap_patching_hdb_server_cf_system_user
            if sap_patching_hdb_server_cf_system_user | d('', true) | length > 0 else '' }}
          --configfile={{ __sap_patching_fact_hdb_hdblcm_configfile }}
      register: __sap_patching_register_hdb_server_hdblcm_output
      # args:
      #   chdir: '"{{ sap_patching_hdb_server_to_apply }}"'
      become: true
      changed_when:
        - "('SAP HANA Database components updated' in __sap_patching_register_hdb_server_hdblcm_output.stdout
            or 'Update of SAP HANA Database components prepared' in __sap_patching_register_hdb_server_hdblcm_output.stdout)"
        - __sap_patching_register_hdb_server_hdblcm_output.rc == 0

    - name: SAP Patching - HDB Server - Apply - Fail if 'hdblcm' command failed
      ansible.builtin.fail:
        msg: |
          FAIL: Execution of HDB server update with 'hdblcm' command has failed.
          Command executed: {{ __sap_patching_register_hdb_server_hdblcm_output.cmd | d('') }}
          Stdout: {{ __sap_patching_register_hdb_server_hdblcm_output.stdout | d('') }}
          Stderr: {{ __sap_patching_register_hdb_server_hdblcm_output.stderr | d('') }}
      when:
        - "'failed' in __sap_patching_register_hdb_server_hdblcm_output.stderr
            or __sap_patching_register_hdb_server_hdblcm_output.rc != 0"


    # We are inside the HSR loop, but the primary/master site may have switched if we are in a cluster and patching the primary/secondary pair
    # So we need to re-check the HSR status and make sure we know who is the current primary
    # We use run_once "trick" here to set this variable on all hosts in the play.
    - name: Block to refresh HSR information
      run_once: true
      when:
        - __sap_patching_params.update_mode != 'prepare'
        - __sap_patching_fact_hdb_hsr_enabled
      block:
        # 2: Second 'sr_state' check after patching to identify primary again.
        - name: SAP Patching - HDB Server - Apply - Check System Replication Status to update primary site information
          ansible.builtin.shell:
            cmd: >-
              source /usr/sap/{{ sap_patching_hdb_system_sid | upper }}/home/.sapenv.sh &&
              {{ sap_patching_hdb_server_install_path }}/hdbnsutil \
              -sr_state
              -sapcontrol=1
          become: true
          become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
          register: __sap_patching_register_hdb_hsr_sr_state_2
          changed_when: false

        - name: SAP Patching - HDB Server - Apply - Fail if HSR state was not obtained successfully
          ansible.builtin.fail:
            msg: |
              FAIL: Status of SAP HANA System Replication does not allow for patching.
              Command executed: {{ sap_patching_hdb_server_install_path }}/hdbnsutil -sr_state -sapcontrol=1
              Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_2.stdout | d('') }}
              Stderr: {{ __sap_patching_register_hdb_hsr_sr_state_2.stderr | d('') }}
          when:
            - "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state_2.stdout \
                or __sap_patching_register_hdb_hsr_sr_state_2.rc != 0"


        - name: Block for when HSR is enabled
          when: "'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_2.stdout"
          block:
            - name: SAP Patching - HDB Server - Apply - HSR - Fail if HSR is not online
              ansible.builtin.fail:
                msg: |
                  FAIL: SAP HANA System Replication is enabled but offline.
                  Unable to proceed with patching.
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_2.stdout | d('') }}
              when: "'online=true' not in __sap_patching_register_hdb_hsr_sr_state_2.stdout"

            # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
            - name: SAP Patching - HDB Server - Apply - HSR - Set facts with parsed sr_state output after patching  # noqa jinja[spacing]
              ansible.builtin.set_fact:
                __sap_patching_fact_hdb_hsr_sites_2: >-
                  {{
                    __sap_patching_register_hdb_hsr_sr_state_2.stdout_lines
                    | select('match', '^siteTier/')
                    | map('regex_search', '^siteTier/(.+)=(.+)$', '\1','\2')
                    | sort(attribute=1, reverse=true)
                  }}

                __sap_patching_fact_hdb_hsr_site_to_host_2: >-
                  {% set pairs_list = [] %}
                  {%- for line in __sap_patching_register_hdb_hsr_sr_state_2.stdout_lines -%}
                    {% if line is match('^mapping/.+=(.+)/(.+)$') %}
                      {%- set parts_by_equals = line.split('=') -%}
                      {%- set parts_by_slash = parts_by_equals[1].split('/') -%}
                      {%- set key_pair = pairs_list.append({'key': parts_by_slash[0], 'value': parts_by_slash[1]}) -%}
                    {% endif %}
                  {%- endfor -%}
                  {{ pairs_list | items2dict }}


            # This needs to be done on the master site. The lowest tier site is the master and it should be up.
            # If it is in the current inventory then we can do this check. If we can't we'll fall back to hdbscons below.
            # Loop 30 times with 20 second delay until replication is active or we get confirmation that this is not the master site.

            ## If HSR is enabled check the replication is active
            # You can check that the REPLICATION_STATUS column in M_SERVICE_REPLICATION has the value ACTIVE for all services.
            # try first: HDBSettings.sh systemReplicationStatus.py but this needs to be run on master
            # HDBSettings.sh systemReplicationStatus.py |awk -F '|' '/^this system/ { print }  $9 ~ /hdbserver02\s+/ { print  $3, $5, $8, $9, $15, $17}'
            # Host          Site Name  Secondary     Replication  Secondary
            #                          Host          Status       Fully Synced
            # ------------  ---------  ------------  -----------  ------------
            # hdbserver01  nameserver    DCW01      hdbserver02  ACTIVE               True
            # hdbserver01  xsengine      DCW01      hdbserver02  ERROR               False
            # hdbserver01  docstore      DCW01      hdbserver02  ERROR               False
            # hdbserver01  indexserver   DCW01      hdbserver02  ERROR               False
            # hdbserver01  dpserver      DCW01      hdbserver02  ERROR               False
            #
            # this system is not a system replication site
            # this system is either not running or not primary system replication site

            # source ~/.profile && HDBSettings.sh systemReplicationStatus.py | \
            # awk -F '|' '/^this system/ {print} $9 ~ /{{ hostvars[inventory_hostname]['ansible_hostname'] }}/ {print $17}'
            # __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]]
            #   == __sap_patching_fact_hdb_hsr_site_to_host_2[__sap_patching_fact_hdb_hsr_sites_2 | last | first ]]

            - name: SAP Patching - HDB Server - Apply - HSR - Get replication state of replication target using Python script on master site
              delegate_to: "{{ __sap_patching_fact_hdb_host_fqdn[__primary_2] }}"
              ansible.builtin.shell:
                cmd: >-
                  set -o pipefail &&
                  source ~/.profile && HDBSettings.sh systemReplicationStatus.py
                  | awk -F '|' '/^this system/ {print} $9 ~ /{{ __primary_1 }}/ {print $17}'
              args:
                executable: /bin/bash
              register: __sap_patching_register_hdb_hsr_sr_status_target
              become: true
              become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
              retries: 30
              delay: 20
              until:
                - "'False' not in __sap_patching_register_hdb_hsr_sr_status_target.stdout
                  or 'this system' in __sap_patching_register_hdb_hsr_sr_status_target.stdout"
              vars:
                __primary_1: "{{ __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] }}"
                __primary_2: "{{ __sap_patching_fact_hdb_hsr_site_to_host_2[__sap_patching_fact_hdb_hsr_sites_2 | last | first] }}"
              when:
                - "'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_2.stdout"
                - __primary_2 in ansible_play_hosts | map('split', '.') | map('first') | list
                - __primary_2 != __primary_1
              changed_when: false

            - name: SAP Patching - HDB Server - Apply - HSR - Fail if Python script for replication target has failed
              ansible.builtin.fail:
                msg: |
                  FAIL: Execution of Python script for replication target has failed.
                  Command executed: HDBSettings.sh systemReplicationStatus.py
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_status_target.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_hsr_sr_status_target.stderr | d('') }}
              when:
                - __sap_patching_register_hdb_hsr_sr_status_target.rc != 0
                # Valid systemReplicationStatus return codes: 10 to 15
                - __sap_patching_register_hdb_hsr_sr_status_target.rc < 10
                  or __sap_patching_register_hdb_hsr_sr_status_target.rc > 15


            - name: SAP Patching - HDB Server - Apply - HSR - Get replication state of replication master using Python script on master site
              delegate_to: "{{ __sap_patching_fact_hdb_host_fqdn[__primary_2] }}"
              ansible.builtin.shell:
                cmd: >-
                  set -o pipefail &&
                  source ~/.profile && HDBSettings.sh systemReplicationStatus.py
                  | awk -F '|' '/^this system/ {print} $3 ~ /{{ __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] }}/ {print $17}'
              args:
                executable: /bin/bash
              register: __sap_patching_register_hdb_hsr_sr_status_master
              become: true
              become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
              retries: 30
              delay: 20
              until:
                - "'False' not in __sap_patching_register_hdb_hsr_sr_status_master.stdout
                  or 'this system' in __sap_patching_register_hdb_hsr_sr_status_master.stdout"
              vars:
                __primary_1: "{{ __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] }}"
                __primary_2: "{{ __sap_patching_fact_hdb_hsr_site_to_host_2[__sap_patching_fact_hdb_hsr_sites_2 | last | first] }}"
              when:
                - "'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_2.stdout"
                - __primary_2 in ansible_play_hosts | map('split', '.') | map('first') | list
                - __primary_2 != __primary_1
              changed_when: false

            - name: SAP Patching - HDB Server - Apply - HSR - Fail if Python script for replication master has failed
              ansible.builtin.fail:
                msg: |
                  FAIL: Execution of Python script for replication master has failed.
                  Command executed: HDBSettings.sh systemReplicationStatus.py
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_status_master.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_hsr_sr_status_master.stderr | d('') }}
              when:
                - __sap_patching_register_hdb_hsr_sr_status_master.rc != 0
                # Valid systemReplicationStatus return codes: 10 to 15
                - __sap_patching_register_hdb_hsr_sr_status_master.rc < 10
                  or __sap_patching_register_hdb_hsr_sr_status_master.rc > 15


            # NOTE: This will never execute because failed conditionals will stop beforehand.
            # <sid>adm@hdbserver01:/usr/sap/<SID>/HDB00> hdbcons "replication info"
            # | grep ReplicationStatus_ | awk -F ':' '{print $2}' | sed -n 's/.*ReplicationStatus_\(.*\)/\1/p'
            # Error
            # Active
            # Syncing
            # If we couldn't get HSR status above (typically because master site is not in the current inventory) we try hdbcons instead.
            # This is less reliable as the step above if the system is both source and target of replication i.e. in a middle of the chain
            # Loop 30 times with 20 second delay until replication is active
            - name: SAP Patching - HDB Server - Apply - HSR - Get replication state using 'hdbcons' on the current site
              ansible.builtin.shell:
                cmd: >-
                  set -o pipefail && source ~/.profile &&
                  hdbcons "replication info"
                  | grep ReplicationStatus_
                  | awk -F ':' '{print $2}'
                  | sed -n 's/.*ReplicationStatus_\(.*\)/\1/p'
              args:
                executable: /bin/bash
              register: __sap_patching_register_hdb_hsr_sr_status_hdbcons
              become: true
              become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
              retries: 30
              delay: 20
              until:
                - "'Error' not in __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout
                  or 'Syncing' not in __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout"
              when:
                - "'mode=none' not in __sap_patching_register_hdb_hsr_srstate.stdout"
                - "__sap_patching_register_hdb_hsr_sr_status_target.stdout | d('',true) | length == 0
                  or 'this system' in __sap_patching_register_hdb_hsr_sr_status_target.stdout"
                - "__sap_patching_register_hdb_hsr_sr_status_master.stdout | d('',true) | length == 0
                  or 'this system' in __sap_patching_register_hdb_hsr_sr_status_master.stdout"
              changed_when: false

            - name: SAP Patching - HDB Server - Apply - HSR - Fail if 'hdbcons' failed to return replication status
              ansible.builtin.fail:
                msg: |
                  FAIL: Execution of 'hdbcons' has failed.
                  Command executed: hdbcons "replication info"
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_hsr_sr_status_hdbcons.stderr | d('') }}
              when: __sap_patching_register_hdb_hsr_sr_status_hdbcons.stdout | length == 0


    - name: Block for cluster
      when:
        - sap_patching_hdb_server_is_clustered
        - __sap_patching_params.update_mode | d('') != 'prepare'
      block:

        # If clustered and not in prepare mode then put cluster in maintenance mode
        # 'false/true' are strings, not booleans
        - name: SAP Patching - HDB Server - Apply - Cluster - Disable maintenance mode for SAP HANA resource
          run_once: true
          ansible.builtin.include_tasks:
            file: "{{ ansible_facts['os_family'] }}/cluster_maintenance.yml"
          vars:
            __hdb_server_cluster_maintenance_op: 'false'

        # TODO: Ideally we check that the resource is fully running before trying to relocate it, but issue is with
        # doing it reliably across RHEL/SLES and when cluster hasn't been created using SAP LL roles.
        # So for now we wait for 1 minute to allow the resource to stabilize (it shouldn't need much as we only turned off the maintenance mode).
        - name: SAP Patching - HDB Server - Apply - Cluster - Wait 60 seconds for HANADB clone resource to stabilize
          ansible.builtin.wait_for:
            timeout: 60

        # if cluster is on, initiate switchover after patching
        # check that it hasn't been done already
        - name: SAP Patching - HDB Server - Apply - Cluster - Relocate the HDB resource
          run_once: true
          ansible.builtin.include_tasks:
            file: "{{ ansible_facts['os_family'] }}/cluster_hdb_relocate.yml"
          when:
            - not __sap_patching_fact_hdb_cluster_relocated | d(false, true)

        # We use run_once "trick" here to set this variable on all hosts in the play.
        # If this is the second iteration of main loop through HSR sites, it will read the correct value on all hosts.
        - name: SAP Patching - HDB Server - Apply - Cluster - Mark that relocation was already completed
          run_once: true
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_cluster_relocated: true
          when:
            - not __sap_patching_fact_hdb_cluster_relocated | d(false, true)
