---

- name: SAP Patching - Validation - Assert that the variables with suffix 'to_apply' are defined as strings
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', var_item, default='SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED') != 'SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED'
      - lookup('ansible.builtin.vars', var_item) is string
    fail_msg: |
      {% if lookup('ansible.builtin.vars', var_item, default='SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED') == 'SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED' %}
        FAIL: The variable '{{ var_item }}' is undefined.
      {% else %}
        FAIL: The variable '{{ var_item }}' is not a String.
      {% endif %}
    quiet: true
  loop:
    - sap_patching_kernel_to_apply
    - sap_patching_hdb_client_to_apply
    - sap_patching_hdb_server_to_apply
    - sap_patching_host_agent_to_apply
    - sap_patching_webdisp_to_apply
  loop_control:
    loop_var: var_item

# The owner and group of the patching files, and the SAPCAR executable used to extract them,
# are validated once in 'validations/file_ownership.yml', included from 'validations/main.yml'.

- name: SAP Patching - Validation - Prepare - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
