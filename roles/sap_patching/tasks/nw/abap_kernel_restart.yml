---

# Update internal variables as xnw_kernel_restart is shared with webdisp.
- name: SAP Patching - Kernel - Restart - Set fact with tasks specific variables
  ansible.builtin.set_fact:
    __sap_patching_fact_sap_system_sid: "{{ sap_patching_sap_system_sid }}"
    __sap_patching_fact_sidadm_user: "{{ sap_patching_sap_system_sid | lower }}adm"
    __sap_patching_fact_kernel_restart_strategy: "{{ sap_patching_kernel_restart_strategy }}"
    __sap_patching_fact_kernel_or_webdisp: "abap_kernel"

- name: SAP Patching - Kernel - Restart - Execute kernel restart function to restart the system
  ansible.builtin.include_tasks:
    file: xnw_kernel_restart.yml
