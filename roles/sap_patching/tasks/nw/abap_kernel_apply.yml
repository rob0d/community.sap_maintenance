# SPDX-License-Identifier: Apache-2.0
---

# Update variables to pass into shared tasks.
- name: SAP Patching - Kernel - Apply - Set fact with 'abap_kernel' specific variables
  ansible.builtin.set_fact:
    __sap_patching_fact_sap_system_sid: "{{ sap_patching_sap_system_sid | upper }}"
    __sap_patching_fact_sidadm_user: "{{ sap_patching_sap_system_sid | lower }}adm"
    __sap_patching_fact_kernel_to_apply: "{{ sap_patching_kernel_to_apply | d('') }}"
    __sap_patching_fact_kernel_to_apply_symlink: "{{ sap_patching_kernel_to_apply_symlink }}"
    __sap_patching_fact_kernel_base: "{{ __sap_patching_kernel_base }}"
    __sap_patching_fact_kernel_files_shared: "{{ sap_patching_kernel_files_shared }}"
    __sap_patching_fact_kernel_type: "abap_kernel"

- name: SAP Patching - Kernel - Apply - Execute shared tasks for kernel apply
  ansible.builtin.include_tasks:
    file: shared_kernel_apply.yml
