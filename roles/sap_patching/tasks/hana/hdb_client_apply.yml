---
# Sanitation and checks
- name: Check that only one of sap_patching_hdb_client_install_path and sap_patching_hdb_client_shared_path is defined and not empty
  ansible.builtin.assert:
    that:
      - (sap_patching_hdb_client_install_path | d('', true) | length > 0) != (sap_patching_hdb_client_shared_path | d('', true) | length > 0)
    fail_msg: "Exactly one of sap_patching_hdb_client_install_path or sap_patching_hdb_client_shared_path must be defined and not empty"
    success_msg: "Only one of sap_patching_hdb_client_install_path or sap_patching_hdb_client_shared_path is defined and not empty"
  changed_when: false

- name: Set sap_patching_hdb_client_to_apply to default if not defined or empty
  ansible.builtin.set_fact:
    sap_patching_hdb_client_to_apply: "{{ sap_patching_hdb_client_to_apply_symlink }}"
  when: sap_patching_hdb_client_to_apply is not defined or sap_patching_hdb_client_to_apply | type_debug == "NoneType" or sap_patching_hdb_client_to_apply | d('', true) |  length == 0

- name: Prepend sap_patching_hdb_client_base if sap_patching_hdb_client_to_apply is not an absolute path
  ansible.builtin.set_fact:
    sap_patching_hdb_client_to_apply: "{{ sap_patching_hdb_client_base }}/{{ sap_patching_hdb_client_to_apply }}"
  when:
    - sap_patching_hdb_client_to_apply is defined
    - not sap_patching_hdb_client_to_apply.startswith('/')

# Target directory checks
- name: Set HDB client installation path to individual path if using individual installation
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_client_path_check: "{{ sap_patching_hdb_client_install_path }}"
  when: sap_patching_hdb_client_install_path | d('', true) | length > 0

- name: Set HDB client installation path to shared path if using shared installation
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_client_path_check: "{{ sap_patching_hdb_client_shared_path }}"
  when: sap_patching_hdb_client_shared_path | d('', true) | length > 0

- name: Check that {{ __sap_patching_fact_hdb_client_path_check }} exists
  ansible.builtin.stat:
    path: "{{ __sap_patching_fact_hdb_client_path_check }}"
  register: __sap_patching_register_hdb_client_install_stat
  changed_when: false

- name: Continue if the target directory is present (this will silently skip servers without HDB client installed)
  when:
    - __sap_patching_register_hdb_client_install_stat.stat.exists
    - __sap_patching_register_hdb_client_install_stat.stat.islnk or __sap_patching_register_hdb_client_install_stat.stat.isdir
  block:
  # - name: Ensure {{ __sap_patching_fact_hdb_client_path_check }} is a directory
  #   ansible.builtin.assert:
  #     that:
  #       - __sap_patching_register_hdb_client_install_stat.stat.exists
  #       - __sap_patching_register_hdb_client_install_stat.stat.islnk or __sap_patching_register_hdb_client_install_stat.stat.isdir
  #     fail_msg: "{{ __sap_patching_fact_hdb_client_path_check }} does not exist or is not a symlink/directory"
  #     success_msg: "{{ __sap_patching_fact_hdb_client_path_check }} exists and is a symlink/directory"
  #   changed_when: false

    - name: Check the content of {{ __sap_patching_fact_hdb_client_path_check }}
      ansible.builtin.find:
        paths: "{{ __sap_patching_fact_hdb_client_path_check }}"
        file_type: any
      register: __sap_patching_register_hdb_client_path_check_files
      changed_when: false

    - name: Ensure {{ __sap_patching_fact_hdb_client_path_check }} is not empty and contains hdbsql or hdbclient
      ansible.builtin.assert:
        that:
          - __sap_patching_register_hdb_client_path_check_files.matched | int > 0
          - "'hdbsql' in __sap_patching_register_hdb_client_path_check_files.files | map(attribute='path') | map('basename') | list or 'hdbclient' in __sap_patching_register_hdb_client_path_check_files.files | map(attribute='path') | map('basename') | list"
        fail_msg: "{{ __sap_patching_fact_hdb_client_path_check }} is empty or doesn't contain required files, this is unexpected for a correctly installed system"
        success_msg: "{{ __sap_patching_fact_hdb_client_path_check }} is not empty and contains required files"
      changed_when: false

    # Local copy of extracted files if not on shared storage
    - name: Copy hdb client to be applied to a local directory if not present on a shared one
      when: not sap_patching_hdb_client_extracted_shared | bool
      ansible.builtin.copy:
        src: "{{ sap_patching_hdb_client_to_apply }}/"
        dest: "{{ sap_patching_hdb_client_extracted_local_path }}"
        remote_src: "{{ sap_patching_hdb_client_extracted_shared | bool }}"
        owner: "{{ sap_patching_sap_system_sid | lower }}adm"
        group: sapsys
        mode: '0755'
        directory_mode: '0755'
      changed_when: true

    - name: Overriding HDB client to apply path settings with extracted local path as it's not present on a shared one and it's just been copied here
      when: not sap_patching_hdb_client_extracted_shared | bool
      ansible.builtin.set_fact:
        sap_patching_hdb_client_to_apply: "{{ sap_patching_hdb_client_extracted_local_path }}"

    # Execute these checks only once if the files to be applied are on shared folder directly accessible from the sap host
    - name: Execute checks of the HDB client files which will be applied in a moment (once if files are shared)
      run_once: "{{ sap_patching_hdb_client_extracted_shared | bool }}"
      block:
        - name: Check that sap_patching_hdb_client_to_apply exists
          ansible.builtin.stat:
            path: "{{ sap_patching_hdb_client_to_apply }}"
          register: __sap_patching_register_hdb_client_to_apply_stat
          failed_when: not __sap_patching_register_hdb_client_to_apply_stat.stat.exists
          changed_when: false

        - name: Ensure sap_patching_hdb_client_to_apply is a directory or symlink
          ansible.builtin.assert:
            that:
              - __sap_patching_register_hdb_client_to_apply_stat.stat.isdir or __sap_patching_register_hdb_client_to_apply_stat.stat.islnk
            fail_msg: "sap_patching_hdb_client_to_apply is not a directory or symlink"
            success_msg: "sap_patching_hdb_client_to_apply is a directory or symlink"
          changed_when: false

        - name: Check the content of {{ sap_patching_hdb_client_to_apply }}
          ansible.builtin.find:
            paths: "{{ sap_patching_hdb_client_to_apply }}"
            file_type: any
          register: __sap_patching_register_hdb_client_to_apply_files
          changed_when: false

        - name: Ensure {{ sap_patching_hdb_client_to_apply }} is not empty and contains client folder and hdbinst
          ansible.builtin.assert:
            that:
              - __sap_patching_register_hdb_client_to_apply_files.matched | int > 0
              - "'client' in __sap_patching_register_hdb_client_to_apply_files.files | map(attribute='path') | map('basename') | list"
              - "'hdbinst' in __sap_patching_register_hdb_client_to_apply_files.files | map(attribute='path') | map('basename') | list"
            fail_msg: "{{ sap_patching_hdb_client_to_apply }} is empty or doesn't contain required files, this is unexpected for a correctly extracted SAR archive"
            success_msg: "{{ sap_patching_hdb_client_to_apply }} is not empty and contains required files"
          changed_when: false

    # Execution
    - name: Prepare command line parameters for hdbinst
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_client_hdbinst_params: >-
         -b
         {{ '--path=' + sap_patching_hdb_client_install_path if sap_patching_hdb_client_install_path | d('', true) | length > 0 else '' }}
         {{ '--sapmnt=' + sap_patching_hdb_client_shared_path if sap_patching_hdb_client_shared_path | d('', true) | length > 0 else '' }}

    # Note, this requires SAP application server to be down if local installation is used
    # If shared client installation is used, run this only once
    # hdbinst will not overwrite anything if the same version is already installed, effectively making this idempotent
    # It will, however report "Installation done" even if nothing was changed
    # "Installation is up-to-date" is present in the /var/tmp/hdb_client*/hdbinst_client.log file but not in stdout/stderr so it's difficult to use it for changed_when
    - name: Update HANA DB client
      run_once: "{{ not sap_patching_hdb_client_extracted_shared | bool }}"
      ansible.builtin.command: >-
        '{{ sap_patching_hdb_client_to_apply }}/hdbinst' {{ __sap_patching_fact_hdb_client_hdbinst_params }}
      register: __sap_patching_register_hdb_client_hdbinst_output
      args:
        chdir: "{{ sap_patching_hdb_client_to_apply }}"
      become: true
      become_user: "{{ sap_patching_sap_system_sid | lower }}adm"
      changed_when: "'Installation done' in __sap_patching_register_hdb_client_hdbinst_output.stdout and __sap_patching_register_hdb_client_hdbinst_output.rc == 0"
      failed_when: "'Installation failed' in __sap_patching_register_hdb_client_hdbinst_output.stderr or __sap_patching_register_hdb_client_hdbinst_output.rc != 0"
