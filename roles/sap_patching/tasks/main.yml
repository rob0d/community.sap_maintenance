---
- name: Verify that sap_patching_execution_plan contains only supported tasks
  run_once: true
  ansible.builtin.assert:
    that:
      - item in sap_patching_exec_def | default({})
    fail_msg: "Execution plan step '{{ item }}' is not known or supported."
  changed_when: false
  loop: "{{ sap_patching_execution_plan }}"
  loop_control:
    label: "Checking step: {{ item }}"

# - name: Looping through the execution plan
