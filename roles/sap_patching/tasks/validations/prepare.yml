---

- name: SAP Patching - Validation - Assert that the variables with suffix 'to_apply' are defined as strings
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', var_item, default='SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED') != 'SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED'
      - lookup('ansible.builtin.vars', var_item) is string
    fail_msg: |
      {% if lookup('ansible.builtin.vars', var_item, default='SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED') == 'SAP_PATCHING_UNDEFINED_VARIABLE_DETECTED' %}
        FAIL: The variable '{{ var_item }}' is undefined.
      {% else %}
        FAIL: The variable '{{ var_item }}' is not a String.
      {% endif %}
    quiet: true
  loop:
    - sap_patching_kernel_to_apply
    - sap_patching_hdb_client_to_apply
    - sap_patching_hdb_server_to_apply
    - sap_patching_host_agent_to_apply
    - sap_patching_webdisp_to_apply
  loop_control:
    loop_var: var_item

- name: SAP Patching - Validation - Prepare - Assert that the variable 'sap_patching_file_owner' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_file_owner is defined
      - sap_patching_file_owner is string
      - sap_patching_file_owner | length > 0
    fail_msg: |
      The variable 'sap_patching_file_owner' is undefined, empty, or invalid.
      It should be a string containing a valid user.

# Ensure that user is present before we attempt become
- name: SAP Patching - Validation - Prepare - Assert that the variable 'sap_patching_file_owner' contains valid user
  ansible.builtin.assert:
    that:
      - ansible_facts["getent_passwd"][sap_patching_file_owner] is defined
    fail_msg: |
      FAIL: The variable 'sap_patching_file_owner' must be set to a valid user on the system.
      The current value '{{ sap_patching_file_owner }}' does not correspond to any user on the system.


- name: SAP Patching - Validation - Prepare - Assert that the variable 'sap_patching_file_group' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_file_group is defined
      - sap_patching_file_group is string
      - sap_patching_file_group | length > 0
    fail_msg: |
      The variable 'sap_patching_file_group' is undefined, empty, or invalid.
      It should be a string containing a valid group.

# Ensure that group is present before we attempt become
- name: SAP Patching - Validation - Prepare - Assert that the variable 'sap_patching_file_group' contains valid group
  ansible.builtin.assert:
    that:
      - ansible_facts["getent_group"][sap_patching_file_group] is defined
    fail_msg: |
      FAIL: The variable 'sap_patching_file_group' must be set to a valid group on the system.
      The current value '{{ sap_patching_file_group }}' does not correspond to any group on the system.


- name: SAP Patching - Validation - Prepare - Assert that the variable 'sap_patching_sapcar_path' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_sapcar_path is defined
      - sap_patching_sapcar_path is string
      - sap_patching_sapcar_path | length > 0
    fail_msg: |
      The variable 'sap_patching_sapcar_path' is undefined, empty, or invalid.
      It should be a string containing a valid file path.

- name: SAP Patching - Validation - Prepare - Stat availability of the path in the variable 'sap_patching_sapcar_path'
  ansible.builtin.stat:
    path: "{{ sap_patching_sapcar_path }}"
  register: __sap_patching_register_sapcar_path_stat

- name: SAP Patching - Validation - Prepare - Fail if path in the variable 'sap_patching_sapcar_path' does not exist as a directory
  ansible.builtin.fail:
    msg: |
      FAIL: The path "{{ sap_patching_sapcar_path }}" does not exist or is not a directory.
      Please ensure that the SAPCAR path is correct and accessible.
  when: not (__sap_patching_register_sapcar_path_stat.stat.exists
          and __sap_patching_register_sapcar_path_stat.stat.isdir)


- name: SAP Patching - Validation - Prepare - Assert that the variable 'sap_patching_sapcar_file_name' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_sapcar_file_name is defined
      - sap_patching_sapcar_file_name is string
      - sap_patching_sapcar_file_name | length > 0
    fail_msg: |
      The variable 'sap_patching_sapcar_file_name' is undefined, empty, or invalid.
      It should be a string containing a valid file name.

- name: SAP Patching - Validation - Prepare - Stat availability of the file in the variable 'sap_patching_sapcar_file_name'
  ansible.builtin.stat:
    path: "{{ __sap_patching_sapcar_path }}/{{ sap_patching_sapcar_file_name }}"
  # Using become_user ensures that stat gathers facts using the correct user.
  become: true
  become_user: "{{ sap_patching_file_owner }}"
  register: __sap_patching_register_sapcar_file_name_stat

- name: SAP Patching - Validation - Prepare - Fail if file in the variable 'sap_patching_sapcar_file_name' is not executable
  ansible.builtin.fail:
    msg: |
      FAIL: The file "{{ __sap_patching_sapcar_path }}/{{ sap_patching_sapcar_file_name }}" does not exist as executable file.
      Please ensure that the SAPCAR file is correct and accessible.
  when:
    - not __sap_patching_register_sapcar_file_name_stat.stat.exists
      or not __sap_patching_register_sapcar_file_name_stat.stat.executable


- name: SAP Patching - Validation - Prepare - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
