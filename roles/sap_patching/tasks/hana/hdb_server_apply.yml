# SPDX-License-Identifier: Apache-2.0
---

# Prepare tasks are doing validation already, but apply can be executed without prepare, so validation must happen again.
- name: SAP Patching - HDB Server - Apply - Stat availability of the base directory
  ansible.builtin.stat:
    path: "{{ __sap_patching_hdb_server_base }}"
  register: __sap_patching_register_hdb_server_apply_base_stat

- name: SAP Patching - HDB Server - Apply - Fail if user cannot write to base directory
  ansible.builtin.fail:
    msg: |
      FAIL: The path "{{ sap_patching_hdb_server_base }}" does not exist or is not a directory.
      Please ensure that the path defined in the variable 'sap_patching_hdb_server_base' is a directory.
  when: not (__sap_patching_register_hdb_server_apply_base_stat.stat.exists
          and __sap_patching_register_hdb_server_apply_base_stat.stat.isdir)


# Load version to apply in this order:
# 1. If 'sap_patching_hdb_server_to_apply' is not empty.
# 2. If '__sap_patching_fact_hdb_server_to_apply' is not defined. We assume prepare was executed.
# 3. Default symlink 'sap_patching_hdb_server_to_apply_symlink'.
- name: SAP Patching - HDB Server - Apply - Set fact with HDB server symlink if not specified to default if not defined or empty
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_server_to_apply: >-
      {{ sap_patching_hdb_server_to_apply | regex_replace('\\/$', '')
        if sap_patching_hdb_server_to_apply | string | trim | length > 0
        else (__sap_patching_fact_hdb_server_to_apply
          if __sap_patching_fact_hdb_server_to_apply is defined
          else sap_patching_hdb_server_to_apply_symlink) }}


- name: SAP Patching - HDB Server - Apply - Set fact with updated HDB server path if it is not an absolute path
  ansible.builtin.set_fact:
    __sap_patching_fact_hdb_server_to_apply:
      "{{ __sap_patching_hdb_server_base }}/{{ __sap_patching_fact_hdb_server_to_apply }}"
  when: not __sap_patching_fact_hdb_server_to_apply.startswith('/')


- name: SAP Patching - HDB Server - Apply - Stat availability of installed HDB server directory
  ansible.builtin.stat:
    path: "{{ sap_patching_hdb_server_install_path }}"
  register: __sap_patching_register_hdb_server_install_stat

# Validate presence of the HDB server installation directory and its content to determine if patching can proceed.
- name: Block to identify if patching can proceed
  when:
    - __sap_patching_register_hdb_server_install_stat.stat.exists
    - __sap_patching_register_hdb_server_install_stat.stat.islnk
      or __sap_patching_register_hdb_server_install_stat.stat.isdir
  block:
    - name: SAP Patching - HDB Server - Apply - Find files in the HDB server install directory {{ sap_patching_hdb_server_install_path }}
      ansible.builtin.find:
        paths: "{{ sap_patching_hdb_server_install_path }}"
        file_type: any
      register: __sap_patching_register_hdb_server_install_path_files

    - name: SAP Patching - HDB Server - Apply - Fail if directory '{{ sap_patching_hdb_server_install_path }}' does not contain HDB server files
      ansible.builtin.fail:
        msg: |
          FAIL: The HDB server installation directory "{{ sap_patching_hdb_server_install_path }}" is empty and patching cannot proceed!
          Ensure that the path points to valid HDB server installation,
          where 'hdbdaemon' and 'hdbindexserver' executables are present.
      vars:
        __basename_list: "{{ __sap_patching_register_hdb_server_install_path_files.files | map(attribute='path') | map('basename') | list }}"
      when:
        - __sap_patching_register_hdb_server_install_path_files.matched | int == 0
          or ('hdbdaemon' not in __basename_list and 'hdbindexserver' not in __basename_list)

    - name: SAP Patching - HDB Server - Apply - Set fact if patching can proceed
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_server_is_ready: true
      vars:
        __basename_list: "{{ __sap_patching_register_hdb_server_install_path_files.files | map(attribute='path') | map('basename') | list }}"
      when:
        - __sap_patching_register_hdb_server_install_path_files.matched | int > 0
        - ('hdbdaemon' in __basename_list and 'hdbindexserver' in __basename_list)


# Use previous validation to silently skip hosts without HDB server installed
- name: Block for HDB server apply execution when HDB server installation directory is present)
  when: __sap_patching_fact_hdb_server_is_ready | d(false)
  block:

    # Prepare tasks prepared all files on all managed nodes, or on first one with shared filesystem.
    # Be it either of those, we still have to ensure that all hosts have access to these files.
    - name: SAP Patching - HDB Server - Apply - Stat availability of extracted HDB server directory
      ansible.builtin.stat:
        path: "{{ sap_patching_hdb_server_to_apply }}"
      register: __sap_patching_register_hdb_server_to_apply_stat

    - name: SAP Patching - HDB Server - Apply - Fail if HDB server path does not exist and is not a directory or symlink
      ansible.builtin.fail:
        msg: |
          FAIL: The specified HDB server path "{{ __sap_patching_fact_hdb_server_to_apply }}" is not a directory or symlink.
          Please ensure that the HDB server files have been extracted to the shared folder
          and the variable 'sap_patching_hdb_server_to_apply' is set correctly.
      when: not __sap_patching_register_hdb_server_to_apply_stat.stat.exists
              or not (__sap_patching_register_hdb_server_to_apply_stat.stat.isdir
                or __sap_patching_register_hdb_server_to_apply_stat.stat.islnk)

    - name: SAP Patching - HDB Server - Apply - Check the content of {{ sap_patching_hdb_server_to_apply }}
      ansible.builtin.find:
        paths: "{{ __sap_patching_fact_hdb_server_to_apply }}"
        file_type: any
      register: __sap_patching_register_hdb_server_to_apply_files

    - name: SAP Patching - HDB Server - Apply - Fail if the HDB server directory is empty
      ansible.builtin.fail:
        msg: |
          FAIL: The directory "{{ __sap_patching_fact_hdb_server_to_apply }}" is empty and patching cannot proceed!
          Ensure that the path points to a valid extracted HDB server, where 'hdblcm' and 'server' executables are present.
      vars:
        __basename_list: "{{ __sap_patching_register_hdb_server_to_apply_files.files | map(attribute='path') | map('basename') | list }}"
      when:
        - __sap_patching_register_hdb_server_to_apply_files.matched | int == 0
          or not ('hdblcm' in __basename_list and 'server' in __basename_list)


    - name: SAP Patching - HDB Server - Apply - Check System Replication Status
      ansible.builtin.shell:
        cmd: >-
          source /usr/sap/{{ sap_patching_hdb_system_sid | upper }}/home/.sapenv.sh &&
          {{ sap_patching_hdb_server_install_path }}/hdbnsutil \
          -sr_state
          -sapcontrol=1
      become: true
      become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
      register: __sap_patching_register_hdb_hsr_sr_state
      changed_when: false

    - name: SAP Patching - HDB Server - Apply - Fail if HSR state does not allow for patching
      ansible.builtin.fail:
        msg: |
          FAIL: Status of SAP HANA System Replication does not allow for patching.
          Command executed: {{ sap_patching_hdb_server_install_path }}/hdbnsutil -sr_state -sapcontrol=1
          Stdout: {{ __sap_patching_register_hdb_hsr_sr_state.stdout | d('') }}
          Stderr: {{ __sap_patching_register_hdb_hsr_sr_state.stderr | d('') }}
      when:
        - "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state.stdout \
            or __sap_patching_register_hdb_hsr_sr_state.rc != 0
            or 'online=true' not in __sap_patching_register_hdb_hsr_sr_state.stdout"

    - name: SAP Patching - HDB Server - Apply - HSR - Set fact if HSR is enabled
      ansible.builtin.set_fact:
        __sap_patching_fact_hdb_hsr_enabled: >-
          {{ true if 'mode=none' not in __sap_patching_register_hdb_hsr_srstate.stdout else false }}

    # Since 'sr_state' can return different modes, we check for all other than 'none'. Examples:
    # mode=primary
    # mode=sync
    - name: Block for when HSR is enabled
      when: __sap_patching_fact_hdb_hsr_enabled
      block:
        # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
        - name: SAP Patching - HDB Server - Apply - HSR - Set facts with parsed sr_state output  # noqa jinja[spacing]
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_hsr_sites: >-
              {{
                __sap_patching_register_hdb_hsr_sr_state.stdout_lines
                | select('match', '^siteTier/')
                | map('regex_search', '^siteTier/(.+)=(.+)$', '\1','\2')
                | sort(attribute=1, reverse=true)
              }}

            __sap_patching_fact_hdb_hsr_site_to_host: >-
              {% set pairs_list = [] %}
              {%- for line in __sap_patching_register_hdb_hsr_sr_state.stdout_lines -%}
                {% if line is match('^mapping/.+=(.+)/(.+)$') %}
                  {%- set parts_by_equals = line.split('=') -%}
                  {%- set parts_by_slash = parts_by_equals[1].split('/') -%}
                  {%- set key_pair = pairs_list.append({'key': parts_by_slash[0], 'value': parts_by_slash[1]}) -%}
                {% endif %}
              {%- endfor -%}
              {{ pairs_list | items2dict }}


        - name: SAP Patching - HDB Server - Apply - HSR - Activate SAP HANA SYSTEM user
          ansible.builtin.command:
            cmd: >-
              /usr/sap/{{ sap_patching_hdb_system_sid }}/SYS/exe/hdb/hdbsql
              -d SYSTEMDB
              -quiet -x -a
              {{ '-U ' + sap_patching_hdb_server_activate_admin_userstore_key
                if sap_patching_hdb_server_activate_admin_userstore_key | d('',true) | length > 0 else '' }}
              {{ '-u ' + sap_patching_hdb_server_activate_admin_user
                if sap_patching_hdb_server_activate_admin_user | d('',true) | length > 0 else '' }}
              {{ '-p ''' + sap_patching_hdb_server_activate_admin_password + ''''
                if sap_patching_hdb_server_activate_admin_password | d('',true) | length > 0 else '' }}
              "ALTER USER {{ sap_patching_hdb_server_cf_system_user
                if sap_patching_hdb_server_cf_system_user | d('',true) | length > 0 else 'SYSTEM' }} ACTIVATE"
          register: __sap_patching_register_hdb_server_activate_system_output
          become: true
          become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
          when:
            - sap_patching_hdb_server_activate_system_user
            # Ensure that it is executed only on primary node, which should be node with lowest site tier value.
            # 'last' returns lowest SiteTier value and 'first' returns hostname.
            - __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_fact_hdb_hsr_sites | last | first ] == ansible_facts['hostname']
            # - __sap_patching_params.update_mode != 'prepare'
          changed_when: "__sap_patching_register_hdb_server_activate_system_output.rc == 0"

        - name: SAP Patching - HDB Server - Apply - HSR - Fail if SYSTEM user activation failed
          ansible.builtin.fail:
            msg: |
              FAIL: Activation of SAP HANA SYSTEM user failed.
              Command executed: {{ __sap_patching_register_hdb_server_activate_system_output.cmd | d('') }}
              Stdout: {{ __sap_patching_register_hdb_server_activate_system_output.stdout | d('') }}
              Stderr: {{ __sap_patching_register_hdb_server_activate_system_output.stderr | d('') }}
          when:
            - "'ERROR' in __sap_patching_register_hdb_server_activate_system_output.stderr
                or __sap_patching_register_hdb_server_activate_system_output.rc != 0"


        - name: SAP Patching - HDB Server - Apply - HSR - Set fact with the initial cluster relocation status
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_cluster_relocated: false

        # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
        - name: SAP Patching - HDB Server - Apply - HSR - Set fact with dictionary of hostname and FQDN of hosts  # noqa jinja[spacing]
          ansible.builtin.set_fact:
            __sap_patching_fact_hdb_host_fqdn: >-
              {% set host_pairs = [] %}
              {%- for host in ansible_play_hosts_all -%}
                {%- set short_name = host.split('.')[0] -%}
                {%- set key_pair = host_pairs.append({'key': short_name, 'value': host}) -%}
              {%- endfor -%}
              {{ host_pairs | items2dict }}

        # Skipping HSR hosts if they don't belong to the current inventory (some sites may not be present on this run).
        - name: SAP Patching - HDB Server - Apply - HSR - Loop through HANA DB sites from highest to lowest tier and apply the patch
          run_once: true
          ansible.builtin.include_tasks:
            file: hdb_server_apply_patch.yml
          loop: "{{ __sap_patching_fact_hdb_hsr_sites }}"
          loop_control:
            loop_var: __sap_patching_hdb_hsr_site
          vars:
            __sap_patching_delegated_hdb_server_host:
              "{{ __sap_patching_fact_hdb_host_fqdn[__sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]]] }}"
          when: __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_hdb_hsr_site[0]] in __sap_patching_fact_hdb_host_fqdn


        # Have re-read the HSR status after patching all sites as the primary may have changed (if clustered and on primary/secondary cluster)
        # or it may not have changed (if just HSR without clustering)
        - name: Block to deactivate HANA SYSTEM user if required (HSR)
          when:
            - sap_patching_hdb_server_activate_system_user | bool
          block:
            # 3: Third 'sr_state' check after patching to see if the replication is still active and the system is online.
            - name: SAP Patching - HDB Server - Apply - HSR - Check System Replication Status after patching
              ansible.builtin.shell:
                cmd: >-
                  source /usr/sap/{{ sap_patching_hdb_system_sid | upper }}/home/.sapenv.sh &&
                  {{ sap_patching_hdb_server_install_path }}/hdbnsutil \
                  -sr_state
                  -sapcontrol=1
              become: true
              become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
              register: __sap_patching_register_hdb_hsr_sr_state_3
              changed_when: false
              failed_when: "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state_3.stdout or __sap_patching_register_hdb_hsr_sr_state_3.rc != 0"


            - name: SAP Patching - HDB Server - Apply - HSR - Fail if HSR state is not valid after patching
              ansible.builtin.fail:
                msg: |
                  FAIL: Status of SAP HANA System Replication is not valid after patching.
                  Command executed: {{ sap_patching_hdb_server_install_path }}/hdbnsutil -sr_state -sapcontrol=1
                  Stdout: {{ __sap_patching_register_hdb_hsr_sr_state_3.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_hsr_sr_state_3.stderr | d('') }}
              when:
                - "'SAPCONTROL-OK' not in __sap_patching_register_hdb_hsr_sr_state_3.stdout \
                    or __sap_patching_register_hdb_hsr_sr_state_3.rc != 0
                    or 'online=true' not in __sap_patching_register_hdb_hsr_sr_state_3.stdout"

            # Reason for noqa: Jinja spacing would squash all lines to left, making it unreadable.
            - name: SAP Patching - HDB Server - Apply - HSR - Set facts with parsed sr_state output after patching  # noqa jinja[spacing]
              ansible.builtin.set_fact:
                __sap_patching_fact_hdb_hsr_sites: >-
                  {{
                    __sap_patching_register_hdb_hsr_sr_state_3.stdout_lines
                    | select('match', '^siteTier/')
                    | map('regex_search', '^siteTier/(.+)=(.+)$', '\1','\2')
                    | sort(attribute=1, reverse=true)
                  }}

                __sap_patching_fact_hdb_hsr_site_to_host: >-
                  {% set pairs_list = [] %}
                  {%- for line in __sap_patching_register_hdb_hsr_sr_state_3.stdout_lines -%}
                    {% if line is match('^mapping/.+=(.+)/(.+)$') %}
                      {%- set parts_by_equals = line.split('=') -%}
                      {%- set parts_by_slash = parts_by_equals[1].split('/') -%}
                      {%- set key_pair = pairs_list.append({'key': parts_by_slash[0], 'value': parts_by_slash[1]}) -%}
                    {% endif %}
                  {%- endfor -%}
                  {{ pairs_list | items2dict }}
              when: "'mode=none' not in __sap_patching_register_hdb_hsr_sr_state_3.stdout"


            - name: SAP Patching - HDB Server - Apply - HSR - Deactivate HANA SYSTEM user
              ansible.builtin.command:
                cmd: >-
                  /usr/sap/{{ sap_patching_hdb_system_sid }}/SYS/exe/hdb/hdbsql
                  -d SYSTEMDB
                  -quiet -x -a
                  {{ '-U ' + sap_patching_hdb_server_activate_admin_userstore_key
                    if sap_patching_hdb_server_activate_admin_userstore_key | d('',true) | length > 0 else '' }}
                  {{ '-u ' + sap_patching_hdb_server_activate_admin_user
                    if sap_patching_hdb_server_activate_admin_user | d('',true) | length > 0 else '' }}
                  {{ '-p '''  + sap_patching_hdb_server_activate_admin_password + ''''
                    if sap_patching_hdb_server_activate_admin_password | d('',true) | length > 0 else '' }}
                  "ALTER USER {{ sap_patching_hdb_server_cf_system_user
                    if sap_patching_hdb_server_cf_system_user | d('',true) | length > 0 else 'SYSTEM' }} DEACTIVATE"
              register: __sap_patching_register_hdb_server_deactivate_system_output
              become: true
              become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
              when:
                # Ensure that it is executed only on primary node, which should be node with lowest site tier value.
                # 'last' returns lowest SiteTier value and 'first' returns hostname.
                - __sap_patching_fact_hdb_hsr_site_to_host[__sap_patching_fact_hdb_hsr_sites | last | first ] == ansible_facts['hostname']
              changed_when: "__sap_patching_register_hdb_server_deactivate_system_output.rc == 0"

            - name: SAP Patching - HDB Server - Apply - HSR - Fail if SYSTEM user deactivation failed
              ansible.builtin.fail:
                msg: |
                  FAIL: Deactivation of SAP HANA SYSTEM user failed.
                  Command executed: {{ __sap_patching_register_hdb_server_deactivate_system_output.cmd | d('') }}
                  Stdout: {{ __sap_patching_register_hdb_server_deactivate_system_output.stdout | d('') }}
                  Stderr: {{ __sap_patching_register_hdb_server_deactivate_system_output.stderr | d('') }}
              when:
                - "'ERROR' in __sap_patching_register_hdb_server_deactivate_system_output.stderr
                    or __sap_patching_register_hdb_server_deactivate_system_output.rc != 0"


    - name: Block when HSR is not enabled
      when: not __sap_patching_fact_hdb_hsr_enabled
      block:
        - name: SAP Patching - HDB Server - Apply - Activate HANA SYSTEM user
          ansible.builtin.command:
            cmd: >-
              /usr/sap/{{ sap_patching_hdb_system_sid }}/SYS/exe/hdb/hdbsql
              -d SYSTEMDB
              -quiet -x -a
              {{ '-U ' + sap_patching_hdb_server_activate_admin_userstore_key
                if sap_patching_hdb_server_activate_admin_userstore_key | d('',true) | length > 0 else '' }}
              {{ '-u ' + sap_patching_hdb_server_activate_admin_user
                if sap_patching_hdb_server_activate_admin_user | d('',true) | length > 0 else '' }}
              {{ '-p '''  + sap_patching_hdb_server_activate_admin_password + ''''
                if sap_patching_hdb_server_activate_admin_password | d('',true) | length > 0 else '' }}
              "ALTER USER {{ sap_patching_hdb_server_cf_system_user
                if sap_patching_hdb_server_cf_system_user | d('',true) | length > 0 else 'SYSTEM' }} ACTIVATE"
          register: __sap_patching_register_hdb_server_activate_system_output
          become: true
          become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
          when: sap_patching_hdb_server_activate_system_user
          changed_when: "__sap_patching_register_hdb_server_activate_system_output.rc == 0"

        - name: SAP Patching - HDB Server - Apply - Fail if SYSTEM user activation failed
          ansible.builtin.fail:
            msg: |
              FAIL: Activation of SAP HANA SYSTEM user failed.
              Command executed: {{ __sap_patching_register_hdb_server_activate_system_output.cmd | d('') }}
              Stdout: {{ __sap_patching_register_hdb_server_activate_system_output.stdout | d('') }}
              Stderr: {{ __sap_patching_register_hdb_server_activate_system_output.stderr | d('') }}
          when:
            - "'ERROR' in __sap_patching_register_hdb_server_activate_system_output.stderr
                or __sap_patching_register_hdb_server_activate_system_output.rc != 0"


        # __sap_patching_delegated_hdb_server_host is set here only for compatibility
        # with the task file which is used for both HSR and no HSR.
        - name: SAP Patching - HDB Server - Apply - Proceed with patching (non-HSR)
          vars:
            __sap_patching_delegated_hdb_server_host: "{{ inventory_hostname }}"
          ansible.builtin.include_tasks: hdb_server_apply_patch.yml

        - name: SAP Patching - HDB Server - Apply - Deactivate HANA SYSTEM user
          ansible.builtin.command:
            cmd: >-
              /usr/sap/{{ sap_patching_hdb_system_sid }}/SYS/exe/hdb/hdbsql
              -d SYSTEMDB
              -quiet -x -a
              {{ '-U ' + sap_patching_hdb_server_activate_admin_userstore_key
                if sap_patching_hdb_server_activate_admin_userstore_key | d('',true) | length > 0 else '' }}
              {{ '-u ' + sap_patching_hdb_server_activate_admin_user
                if sap_patching_hdb_server_activate_admin_user | d('',true) | length > 0 else '' }}
              {{ '-p '''  + sap_patching_hdb_server_activate_admin_password + ''''
                if sap_patching_hdb_server_activate_admin_password | d('',true) | length > 0 else '' }}
              "ALTER USER {{ sap_patching_hdb_server_cf_system_user
                if sap_patching_hdb_server_cf_system_user | d('',true) | length > 0 else 'SYSTEM' }} DEACTIVATE"
          register: __sap_patching_register_hdb_server_deactivate_system_output
          become: true
          become_user: "{{ sap_patching_hdb_system_sid | lower }}adm"
          when: sap_patching_hdb_server_activate_system_user
          changed_when: "__sap_patching_register_hdb_server_deactivate_system_output.rc == 0"

        - name: SAP Patching - HDB Server - Apply - HSR - Fail if SYSTEM user deactivation failed
          ansible.builtin.fail:
            msg: |
              FAIL: Deactivation of SAP HANA SYSTEM user failed.
              Command executed: {{ __sap_patching_register_hdb_server_deactivate_system_output.cmd | d('') }}
              Stdout: {{ __sap_patching_register_hdb_server_deactivate_system_output.stdout | d('') }}
              Stderr: {{ __sap_patching_register_hdb_server_deactivate_system_output.stderr | d('') }}
          when:
            - "'ERROR' in __sap_patching_register_hdb_server_deactivate_system_output.stderr
                or __sap_patching_register_hdb_server_deactivate_system_output.rc != 0"


# Example outputs from 'sr_state' command:
# ### no HSR
# psaadm@dvpcpsadbw01:/usr/sap/PSA/HDB00> hdbnsutil -sr_state -sapcontrol=1
# SAPCONTROL-OK: <begin>
# online=true
# mode=none
# SAPCONTROL-OK: <end>
# done.
# ### 3 tier HSR - primary
# ppaadm@hdbserver01:/usr/sap/PPA/HDB00> hdbnsutil -sr_state -sapcontrol=1
# SAPCONTROL-OK: <begin>
# online=true
# mode=sync
# operation mode=logreplay
# site id=1
# site name=DCS01
# isSource=false
# isConsumer=true
# hasConsumers=false
# isTakeoverActive=false
# isPrimarySuspended=false
# isTimetravelEnabled=false
# replayMode=auto
# active primary site=4
# primary masters=hdbserver02
