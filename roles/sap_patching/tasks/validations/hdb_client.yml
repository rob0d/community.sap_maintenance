---

- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_sap_system_sid' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_sap_system_sid is defined
      - sap_patching_sap_system_sid is string
      - sap_patching_sap_system_sid | length  == 0 or (sap_patching_sap_system_sid | length == 3 and sap_patching_sap_system_sid.isupper())
    fail_msg: |
      The variable 'sap_patching_sap_system_sid' is undefined, not upper case, not 3 characters long or invalid.
      It should be a either empty string (if not required in the execution plan) or a valid SAP system SID (3 characters).


- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_base' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_base is defined
      - sap_patching_hdb_client_base is string
      - sap_patching_hdb_client_base | length > 0
      - sap_patching_hdb_client_base is match('^/')
    fail_msg: |
      The variable 'sap_patching_hdb_client_base' is undefined, empty, or invalid.
      It should be an absolute path (starting with /) where HDB client SAR files are stored and extraction directories are created.

- name: SAP Patching - Validation - HDB Client - Check if path in the variable 'sap_patching_hdb_client_base' exists and is a directory
  ansible.builtin.stat:
    path: "{{ sap_patching_hdb_client_base }}"
  register: __sap_patching_register_hdb_client_base_stat
  failed_when:
    - not (__sap_patching_register_hdb_client_base_stat.stat.exists
        and __sap_patching_register_hdb_client_base_stat.stat.isdir)


- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_source' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_source is defined
      - sap_patching_hdb_client_source is string
      - sap_patching_hdb_client_source | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_client_source' is undefined, empty, or invalid.
      It should be a path where the HDB client SAR files are located (used during the prepare step).

- name: SAP Patching - Validation - HDB Client - Check if path in the variable 'sap_patching_hdb_client_source' exists and is a directory
  ansible.builtin.stat:
    path: "{{ sap_patching_hdb_client_source }}"
  register: __sap_patching_register_hdb_client_source_stat
  failed_when:
    - not (__sap_patching_register_hdb_client_source_stat.stat.exists
        and __sap_patching_register_hdb_client_source_stat.stat.isdir)


- name: SAP Patching - Validation - HDB Client - Assert that HDB client installation paths are mutually exclusive
  ansible.builtin.assert:
    that:
      - (sap_patching_hdb_client_install_path | d('', true) | length > 0) != (sap_patching_hdb_client_shared_path | d('', true) | length > 0)
    fail_msg: |
      The variables 'sap_patching_hdb_client_install_path' and 'sap_patching_hdb_client_shared_path' are mutually exclusive.
      Define exactly one of available:
        - 'sap_patching_hdb_client_install_path' for individual installation
        - 'sap_patching_hdb_client_shared_path' for shared installation


- name: Block when sap_patching_hdb_client_install_path is defined
  when: sap_patching_hdb_client_install_path | d('', true) | length > 0
  block:
    - name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_install_path' is valid when defined
      ansible.builtin.assert:
        that:
          - sap_patching_hdb_client_install_path is defined
          - sap_patching_hdb_client_install_path is string
        fail_msg: |
          The variable 'sap_patching_hdb_client_install_path' is undefined or invalid.
          It should be the installation path of the HDB client (used for --path option of hdbinst).

    - name: SAP Patching - Validation - HDB Client - Check if path in the variable 'sap_patching_hdb_client_install_path' exists and is not a directory
      ansible.builtin.stat:
        path: "{{ sap_patching_hdb_client_install_path }}"
      register: __sap_patching_register_hdb_client_install_path_stat
      failed_when:
        - not (__sap_patching_register_hdb_client_install_path_stat.stat.exists
            and not __sap_patching_register_hdb_client_install_path_stat.stat.isdir)


- name: Block when sap_patching_hdb_client_shared_path is defined
  when: sap_patching_hdb_client_shared_path | d('', true) | length > 0
  block:
    - name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_shared_path' is valid when defined
      ansible.builtin.assert:
        that:
          - sap_patching_hdb_client_shared_path is defined
          - sap_patching_hdb_client_shared_path is string
        fail_msg: |
          The variable 'sap_patching_hdb_client_shared_path' is undefined or invalid.
          It should be the path to the shared directory (used for --sapmnt option of hdbinst).

    - name: SAP Patching - Validation - HDB Client - Check if path in the variable 'sap_patching_hdb_client_shared_path' exists and is a directory
      ansible.builtin.stat:
        path: "{{ sap_patching_hdb_client_shared_path }}"
      register: __sap_patching_register_hdb_client_shared_path_stat
      failed_when:
        - not (__sap_patching_register_hdb_client_shared_path_stat.stat.exists
            and __sap_patching_register_hdb_client_shared_path_stat.stat.isdir)


- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_extracted_shared' is defined and valid
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_extracted_shared is defined
      - sap_patching_hdb_client_extracted_shared is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_client_extracted_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating if extracted HDB client source files are on shared storage (e.g. NFS share).

- name: Block when sap_patching_hdb_client_extracted_shared is false
  when: not sap_patching_hdb_client_extracted_shared
  block:
    - name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_extracted_local_path' is defined and valid
      ansible.builtin.assert:
        that:
          - sap_patching_hdb_client_extracted_local_path is defined
          - sap_patching_hdb_client_extracted_local_path is string
          - sap_patching_hdb_client_extracted_local_path | length > 0
          - sap_patching_hdb_client_extracted_local_path is match('^/')
        fail_msg: |
          The variable 'sap_patching_hdb_client_extracted_local_path' is undefined, empty, or invalid.
          It should be an absolute path (starting with /) where a local copy of extracted HDB client files is stored to run hdbinst.

    - name: SAP Patching - Validation - HDB Client - Check if path in the variable 'sap_patching_hdb_client_extracted_local_path' exists and is a directory
      ansible.builtin.stat:
        path: "{{ sap_patching_hdb_client_extracted_local_path }}"
      register: __sap_patching_register_hdb_client_extracted_local_path_stat
      failed_when:
        - not (__sap_patching_register_hdb_client_extracted_local_path_stat.stat.exists
            and __sap_patching_register_hdb_client_extracted_local_path_stat.stat.isdir)


- name: SAP Patching - Validation - HDB Client - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
