---
- name: Setting correct variables for restart task
  ansible.builtin.set_fact:
    __sap_patching_fact_sap_system_sid: "{{ sap_patching_sap_system_sid }}"
    __sap_patching_fact_kernel_restart_strategy: "{{ sap_patching_kernel_restart_strategy }}"
    __sap_patching_fact_kernel_or_webdisp: "abap_kernel"

- name: Execute kernel restart function to restart the system
  ansible.builtin.include_tasks:
    file: xnw_kernel_restart.yml
