---

# NOTE: Do not change variables in this file as they define how execution steps are executed and validated.
# Variables in this file are not meant to be overridden by users.
# User variables should be defined in the 'defaults/main.yml' file or passed as extra-vars.


# The 'where' condition must evaluate to a boolean true/false in YAML format. - NOT USED anymore. To be removed at the end of 2027.
# tags - not used, replaced by execution plan. To be removed at the end of 2027.
# vars - set as __sap_patching_params dictionary containing all variables for the task file
__sap_patching_exec_def:
  # ABAP kernel
  abap_kernel_prepare:
    file: nw/abap_kernel_prepare.yml
    validators:
      - prepare
      - abap
      - kernel
    where: "{% if 'nwas_abap_ascs' in group_names %}true{% else %}false{% endif %}"
    vars:
    # Directory and permission checks must run on every host, so the step itself is not run_once.
    # 'sap_patching_kernel_files_shared' is applied on task level to the copy and extract blocks only.
    run_once: false

  abap_kernel_apply:
    file: nw/abap_kernel_apply.yml
    validators:
      - abap
      - kernel
    where: "{% if 'nwas_abap_ascs' in group_names %}true{% else %}false{% endif %}"
    vars:
    # Global exe detection must run on every host, so the step itself is not run_once.
    # Patching of the global exe directory is limited on task level to the first host where the kernel was found.
    run_once: false

  abap_kernel_restart:
    file: nw/abap_kernel_restart.yml
    validators:
      - abap
      - kernel
    where: "{% if group_names | select('search', '^nwas_abap.*') | list | length > 0 %}true{% else %}false{% endif %}"
    vars:
    # Used on task level and only for RKS, while other modes will be executed on all hosts in play.
    run_once: false


  # HANA DB client
  hdb_client_prepare:
    file: hana/hdb_client_prepare.yml
    validators:
      - prepare
      - hdb_client
    where: "{% if 'nwas_abap_pas' in group_names %}true{% else %}false{% endif %}"
    tags:
      - sap_patching_hdb_client_prepare
    vars:
    # Variable defines if source or base directories are shared, thus available on all hosts in play.
    run_once: "{{ sap_patching_hdb_client_files_shared | d(true) }}"

  hdb_client_apply:
    file: hana/hdb_client_apply.yml
    validators:
      - hdb_client
    where: "{% if 'nwas_abap_pas' in group_names or 'nwas_abap_aas' in group_names %}true{% else %}false{% endif %}"
    tags:
      - sap_patching_hdb_client_apply
    vars:
    # Used on task level only when 'sap_patching_hdb_client_shared_path' is defined.
    run_once: false


  # HANA DB server platform
  hdb_server_prepare:
    file: hana/hdb_server_prepare.yml
    validators:
      - prepare
      - hdb_server
    where:
    vars:
    # Variable defines if source or base directories are shared, thus available on all hosts in play.
    run_once: "{{ sap_patching_hdb_server_files_shared | d(true) }}"

  hdb_server_apply:
    file: hana/hdb_server_apply.yml
    validators:
      - hdb_server
    where:
    vars:
      update_mode: full
    # HANA does not have global directory like ABAP kernel, so patching is executed on all hosts in play.
    run_once: false

  hdb_server_update_prepare:
    file: hana/hdb_server_apply.yml
    validators:
      - hdb_server
    where:
    vars:
      update_mode: prepare
    run_once: false

  hdb_server_update_resume:
    file: hana/hdb_server_apply.yml
    validators:
      - hdb_server
    where:
    vars:
      update_mode: resume
    run_once: false


  # Host agent
  host_agent_prepare:
    file: agents/host_agent_prepare.yml
    validators:
      - prepare
      - host_agent
    where: "{% if 'nwas_abap_pas' in group_names %}true{% else %}false{% endif %}"
    vars:
    # Variable defines if source or base directories are shared, thus available on all hosts in play.
    run_once: "{{ sap_patching_host_agent_files_shared | d(true) }}"

  host_agent_apply_auto:
    file: agents/host_agent_apply.yml
    validators:
      - host_agent
    where: "{% if 'nwas_abap_pas' in group_names %}true{% else %}false{% endif %}"
    vars:
      update_mode: auto
    # Host agent is always installed locally, so patching is executed on all hosts in play.
    run_once: false

  host_agent_apply_manual:
    file: agents/host_agent_apply.yml
    validators:
      - host_agent
    where: true
    vars:
      update_mode: manual
    # Host agent is always installed locally, so patching is executed on all hosts in play.
    run_once: false


  # Web disp
  webdisp_prepare:
    file: nw/webdisp_prepare.yml
    validators:
      - prepare
      - webdisp
    where: "{% if 'webdisp_nodes' in group_names %}true{% else %}false{% endif %}"
    vars:
    # Directory and permission checks must run on every host, so the step itself is not run_once.
    # 'sap_patching_webdisp_files_shared' is applied on task level to the copy and extract blocks only.
    run_once: false

  webdisp_apply:
    file: nw/webdisp_apply.yml
    validators:
      - webdisp
    where: "{% if 'webdisp_nodes' in group_names %}true{% else %}false{% endif %}"
    vars:
    # Every Web Dispatcher host has its own global exe directory, so all of them are patched.
    run_once: false

  webdisp_restart:
    file: nw/webdisp_restart.yml
    validators:
      - webdisp
    where: "{% if group_names | select('search', '^webdisp.*') | list | length > 0 %}true{% else %}false{% endif %}"
    vars:
    # Used on task level and only for RKS, while other modes will be executed on all hosts in play.
    run_once: false


  # All stop tasks
  abap_stop_system:
    file: startstop/abap_stop.yml
    validators:
      - abap
    where: "{% if group_names | select('search', '^nwas_abap.*') | list | length > 0 %}true{% else %}false{% endif %}"
    vars:
      sap_control_action: stop_system
      task_execution_mode: direct
    # Sapcontrol with 'StopSystem' is used and it must be executed only once.
    run_once: true

  # hdb_stop_instance:
  #   file: startstop/hdb_stop.yml
  #   where: "{% if group_names | select('search', '^hana.*') | list | length > 0 %}true{% else %}false{% endif %}"
  #   vars:
  #     sap_control_action: stop_instance
  #   run_once: false


  # All start tasks
  abap_start_system:
    file: startstop/abap_start.yml
    validators:
      - abap
    where: "{% if group_names | select('search', '^nwas_abap.*') | list | length > 0 %}true{% else %}false{% endif %}"
    vars:
      sap_control_action: start_system
      task_execution_mode: direct
    # Sapcontrol with 'StartSystem' is used and it must be executed only once.
    run_once: true

  # hdb_start_instance:
  #   file: startstop/hdb_start.yml
  #   where: "{% if group_names | select('search', '^hana.*') | list | length > 0 %}true{% else %}false{% endif %}"
  #   vars:
  #     sap_control_action: start_instance
  # run_once: false


# Default sub-folders names which store the extracted files
__sap_patching_kernel_extracted: extracted
__sap_patching_hdb_client_extracted: extracted
__sap_patching_hdb_server_extracted: extracted
__sap_patching_host_agent_extracted: extracted
__sap_patching_webdisp_extracted: extracted

# Default paths without trailing slash
__sap_patching_kernel_source: "{{ sap_patching_kernel_source | regex_replace('\\/$', '') }}"
__sap_patching_kernel_source_local: "{{ sap_patching_kernel_source_local | regex_replace('\\/$', '') }}"
__sap_patching_kernel_base: "{{ sap_patching_kernel_base | regex_replace('\\/$', '') }}"

__sap_patching_hdb_server_source: "{{ sap_patching_hdb_server_source | regex_replace('\\/$', '') }}"
__sap_patching_hdb_server_source_local: "{{ sap_patching_hdb_server_source_local | regex_replace('\\/$', '') }}"
__sap_patching_hdb_server_base: "{{ sap_patching_hdb_server_base | regex_replace('\\/$', '') }}"

__sap_patching_hdb_client_source: "{{ sap_patching_hdb_client_source | regex_replace('\\/$', '') }}"
__sap_patching_hdb_client_source_local: "{{ sap_patching_hdb_client_source_local | regex_replace('\\/$', '') }}"
__sap_patching_hdb_client_base: "{{ sap_patching_hdb_client_base | regex_replace('\\/$', '') }}"

__sap_patching_webdisp_source: "{{ sap_patching_webdisp_source | regex_replace('\\/$', '') }}"
__sap_patching_webdisp_source_local: "{{ sap_patching_webdisp_source_local | regex_replace('\\/$', '') }}"
__sap_patching_webdisp_base: "{{ sap_patching_webdisp_base | regex_replace('\\/$', '') }}"

__sap_patching_host_agent_source: "{{ sap_patching_host_agent_source | regex_replace('\\/$', '') }}"
__sap_patching_host_agent_source_local: "{{ sap_patching_host_agent_source_local | regex_replace('\\/$', '') }}"
__sap_patching_host_agent_base: "{{ sap_patching_host_agent_base | regex_replace('\\/$', '') }}"

__sap_patching_sapcar_path: "{{ sap_patching_sapcar_path | regex_replace('\\/$', '') }}"

# Default boolean variables
__sap_patching_kernel_normal_mode: true
__sap_patching_kernel_append_mode: false
__sap_patching_kernel_delta_mode: false

# Global executable directory for the SAP kernel
# Generally no need to change this as it defaults to /usr/sap/<SID>/SYS/exe/run
__sap_patching_fact_kernel_global_exe: ''
