---

- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_sap_system_sid' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_sap_system_sid is defined
      - sap_patching_sap_system_sid is string
      - sap_patching_sap_system_sid | trim | length == 3
    fail_msg: |
      The variable 'sap_patching_sap_system_sid' is undefined, not 3 characters long or invalid.
      It should be a valid SAP system SID string of 3 characters.

- name: SAP Patching - Validation - HDB Client - Set fact with the system SID to be used for HANA client
  ansible.builtin.set_fact:
    __sap_patching_fact_sidadm_user:
      "{{ sap_patching_sap_system_sid | upper }}adm"


# Validation of directory existence is not performed here, because:
# - Prepare tasks will create directory if not present.
# - Apply task will fail if not present.
- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_base' is defined as valid string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_base is defined
      - sap_patching_hdb_client_base is string
      - sap_patching_hdb_client_base | length > 0
      - sap_patching_hdb_client_base is match('^/')
    fail_msg: |
      The variable 'sap_patching_hdb_client_base' is undefined, empty, or invalid.
      It should be an absolute path (starting with /) where HDB client SAR files are stored and extraction directories are created.

# Validation of directory existence is not performed here, because:
# - Prepare tasks will create directory if not present.
#   Required when 'sap_patching_hdb_client_files_on_target' is 'false'.
- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_source' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_source is defined
      - sap_patching_hdb_client_source is string
      - sap_patching_hdb_client_source | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_client_source' is undefined, empty, or invalid.
      It should be a path where the HDB client SAR files are located (used during the prepare step).


- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_files_shared' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_files_shared is defined
      - sap_patching_hdb_client_files_shared is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_client_files_shared' is undefined or invalid.
      It should be a boolean (true/false) indicating whether the HDB client files will be shared among multiple hosts.

- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_files_on_target' is defined as boolean
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_files_on_target is defined
      - sap_patching_hdb_client_files_on_target is boolean
    fail_msg: |
      The variable 'sap_patching_hdb_client_files_on_target' is undefined or invalid.
      It should be a boolean (true/false) indicating whether the HDB client files are already present on the managed nodes.

- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_source_local' is defined as non-empty string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_source_local is defined
      - sap_patching_hdb_client_source_local is string
      - sap_patching_hdb_client_source_local | length > 0
    fail_msg: |
      The variable 'sap_patching_hdb_client_source_local' is undefined, empty, or invalid.
      It should be a path where the HDB client files are located on the control node.
  when: not sap_patching_hdb_client_files_on_target


- name: SAP Patching - Validation - HDB Client - Assert that HDB client installation paths are mutually exclusive
  ansible.builtin.fail:
    msg: |
      The variables 'sap_patching_hdb_client_install_path' and 'sap_patching_hdb_client_shared_path' are mutually exclusive.
      Define exactly one of available:
        - 'sap_patching_hdb_client_install_path' for individual installation
        - 'sap_patching_hdb_client_shared_path' for shared installation
  when:
    - (sap_patching_hdb_client_install_path | d('', true) | length > 0 and sap_patching_hdb_client_shared_path | d('', true) | length > 0)
      or (sap_patching_hdb_client_install_path | d('', true) | length == 0 and sap_patching_hdb_client_shared_path | d('', true) | length == 0)


- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_install_path' is defined as string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_install_path is defined
      - sap_patching_hdb_client_install_path is string
    fail_msg: |
      The variable 'sap_patching_hdb_client_install_path' is undefined or invalid.
      It should be the installation path of the HDB client (used for --path option of hdbinst).
  when: sap_patching_hdb_client_install_path | d('', true) | length > 0

- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_shared_path' is defined as string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_shared_path is defined
      - sap_patching_hdb_client_shared_path is string
    fail_msg: |
      The variable 'sap_patching_hdb_client_shared_path' is undefined or invalid.
      It should be the path to the shared directory (used for --sapmnt option of hdbinst).
  when: sap_patching_hdb_client_shared_path | d('', true) | length > 0


# We do not check if it is empty string, because detection will populate it.
- name: SAP Patching - Validation - HDB Client - Assert that the variable 'sap_patching_hdb_client_to_apply' is defined as string
  ansible.builtin.assert:
    that:
      - sap_patching_hdb_client_to_apply is defined
      - sap_patching_hdb_client_to_apply is string
    fail_msg: |
      The variable 'sap_patching_hdb_client_to_apply' is undefined or invalid.
      It should be either empty string (to use default symlink) or a path to the HDB client to be applied.


- name: SAP Patching - Validation - HDB Client - Set fact that validation was completed
  ansible.builtin.set_fact:
    __sap_patching_fact_validations_completed:
      "{{ __sap_patching_fact_validations_completed | d([]) + [validation_item] }}"
